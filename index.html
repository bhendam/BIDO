    let oi=0,od=0;
    ents.filter(e=>F.from&&e.date<F.from).forEach(e=>legsOf(e).forEach(l=>{
      if(l.to===loc)l.cond==='intact'?oi+=l.count:od+=l.count;
      if(l.from===loc)l.cond==='intact'?oi-=l.count:od-=l.count}));
    const mine=ents.filter(e=>inR(e)&&legsOf(e).some(l=>l.from===loc||l.to===loc))
      .sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq);
    let ri=oi,rd=od,TI=0,TO=0;
    const rows=mine.map(e=>{
      let ii=0,id=0,oo=0,od2=0;const other=new Set();
      legsOf(e).forEach(l=>{
        if(l.to===loc){l.cond==='intact'?ii+=l.count:id+=l.count;if(l.from!==loc)other.add(D.nameOf(l.from))}
        if(l.from===loc){l.cond==='intact'?oo+=l.count:od2+=l.count;if(l.to!==loc)other.add(D.nameOf(l.to))}});
      ri+=ii-oo;rd+=id-od2;TI+=ii+id;TO+=oo+od2;
      return `<tr><td class="n">${arDate(e.date)}</td>
        <td>${esc(BOXOP[e.op]||'حركة')}${e.auto?' <span class="tag">آلي</span>':''}</td>
        <td>${esc([...other].join(' · ')||'—')}</td>
        <td class="n cin">${ii+id||''}</td><td class="n cout">${oo+od2||''}</td>
        <td class="n" style="font-weight:600">${loc===WH?ri+'/'+rd:ri}</td></tr>`}).join('');
    const tbl=`<table><thead><tr><th>التاريخ</th><th>العملية</th><th>الطرف الآخر</th>
      <th class="n">وارد</th><th class="n">صادر</th>
      <th class="n">${loc===WH?'الرصيد سليم/تالف':'العهدة'}</th></tr></thead>
      <tbody><tr><td colspan="3">رصيد افتتاحي للفترة</td><td class="n"></td><td class="n"></td>
        <td class="n" style="font-weight:600">${loc===WH?oi+'/'+od:oi}</td></tr>${rows}</tbody>
      <tfoot><tr><td colspan="3">الإجمالي (${mine.length} حركة)</td>
        <td class="n">${TI}</td><td class="n">${TO}</td>
        <td class="n">${loc===WH?ri+'/'+rd:ri}</td></tr></tfoot></table>`;
    S.print={title:`كشف عهدة البكش — ${D.nameOf(loc)}`,html:tbl,phone:D.phoneOf(loc)};
    const b=D.boxOf(loc);
    return t+`<div class="eyebrow">كشف عهدة — ${esc(D.nameOf(loc))}</div>
      <div class="card">
        <div class="diff"><span>رصيد افتتاحي للفترة</span>
          <b>${loc===WH?`${oi} سليم · ${od} تالف`:`${oi} صندوق`}</b></div>
        ${mine.length?`<div class="tscroll">${tbl}</div>`:'<div class="empty">لا حركات في المدى المحدد</div>'}
        <div class="diff over"><span>رصيد آخر الفترة</span>
          <b>${loc===WH?`${ri} سليم · ${rd} تالف`:`${ri} صندوق`}</b></div>
        <div class="diff"><span>الرصيد الحالي الكلي</span>
          <b>${loc===WH?`${b.intact} سليم · ${b.damaged} تالف`:`${b.intact} صندوق`}${b.loss?` · فاقد ${b.loss}`:''}</b></div>
        <p class="note">يشمل ترحيل البكش الآلي المصاحب لفواتير البيع (المعلَّم بـ«آلي»).
          غيّر «الجهة» من الفلتر فوق لعرض كشف مزرعة أو مبيع آخر.</p></div>`;
  }
  /* يوم واحد مختار: تقرير مفصّل بكل صادر ووارد ورصيد أول وآخر اليوم */
  if(S.sub.repbox==='daily'&&F.from&&F.from===F.to){
    const day=F.from;
    let oi=0,od=0;
    ents.filter(e=>e.date<day).forEach(e=>legsOf(e).forEach(l=>{
      if(l.to===loc)l.cond==='intact'?oi+=l.count:od+=l.count;
      if(l.from===loc)l.cond==='intact'?oi-=l.count:od-=l.count}));
    const day1=ents.filter(e=>e.date===day&&legsOf(e).some(l=>l.from===loc||l.to===loc))
      .sort((a,b)=>a.seq-b.seq);
    let ci=oi,cd=od,TI=0,TO=0;
    const rows=day1.map(e=>{
      let ii=0,idd=0,oo=0,od2=0;const other=new Set();
      legsOf(e).forEach(l=>{
        if(l.to===loc){l.cond==='intact'?ii+=l.count:idd+=l.count;if(l.from!==loc&&l.from!=='#ADJ')other.add(D.nameOf(l.from))}
        if(l.from===loc){l.cond==='intact'?oo+=l.count:od2+=l.count;if(l.to!==loc&&l.to!=='#ADJ')other.add(D.nameOf(l.to))}});
      ci+=ii-oo;cd+=idd-od2;TI+=ii+idd;TO+=oo+od2;
      return `<tr><td>${esc(BOXOP[e.op]||'حركة')}${e.auto?' <span class="tag">آلي</span>':''}</td>
        <td>${esc([...other].join(' · ')||'—')}</td>
        <td>${esc(e.driverId?D.nameOf(e.driverId):'—')}</td>
        <td class="n cin">${ii+idd||''}</td><td class="n cout">${oo+od2||''}</td></tr>`}).join('');
    const B=D.boxOf(loc),W=loc===WH;
    const fmt=(i,d2)=>W?`${i} سليم · ${d2} تالف`:`${i} صندوق`;
    const tbl=`<table><thead><tr><th>العملية</th><th>الطرف الآخر</th><th>السائق</th>
      <th class="n">وارد</th><th class="n">صادر</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="5">لا حركات في هذا اليوم</td></tr>'}</tbody>
      <tfoot><tr><td colspan="3">إجمالي ${day1.length} حركة</td>
        <td class="n">${TI}</td><td class="n">${TO}</td></tr></tfoot></table>`;
    const summary=`<h3>أرصدة اليوم</h3><table><thead><tr><th>البند</th><th class="n">العدد</th></tr></thead><tbody>
      <tr><td>رصيد افتتاحي أول اليوم</td><td class="n">${fmt(oi,od)}</td></tr>
      <tr><td>إجمالي الوارد</td><td class="n">${TI}</td></tr>
      <tr><td>إجمالي الصادر</td><td class="n">${TO}</td></tr>
      <tr><td>رصيد ختامي آخر اليوم</td><td class="n">${fmt(ci,cd)}</td></tr></tbody>
      <tfoot><tr><td>العدد الفعلي الآن في ${esc(D.nameOf(loc))}</td>
        <td class="n">${fmt(B.intact,B.damaged)}</td></tr></tfoot></table>`;
    S.print={title:`تقرير ${D.nameOf(loc)} ليوم ${arDate(day)}`,html:summary+'<h3>حركات اليوم</h3>'+tbl};
    return t+`<div class="eyebrow">${esc(D.nameOf(loc))} — ${arDate(day)}</div>
      <div class="card">
        <div class="diff"><span>رصيد أول اليوم</span><b>${fmt(oi,od)}</b></div>
        <div class="row"><div class="diff over" style="flex:1"><span>وارد</span><b>${TI}</b></div>
          <div class="diff short" style="flex:1"><span>صادر</span><b>${TO}</b></div></div>
        <div class="diff"><span>رصيد آخر اليوم</span><b>${fmt(ci,cd)}</b></div>
        <div class="diff over"><span>العدد الفعلي الآن</span><b>${fmt(B.intact,B.damaged)}</b></div>
      </div>
      <div class="eyebrow">حركات اليوم (${day1.length})</div>
      <div class="card"><div class="tscroll">${tbl}</div>
        <p class="note">اختر «اليوم» أو حدّد نفس التاريخ في «من» و«إلى» لتقرير يوم واحد مفصّل.
          مدى أكبر من يوم يعرض ملخصاً يومياً.</p></div>`;
  }
  if(S.sub.repbox==='daily'){
    /* رصيد افتتاحي = كل الحركات قبل «من»، ثم يوم بيوم: وارد − صادر = رصيد ختامي */
    let oI=0,oD=0;
    ents.filter(e=>e.date<F.from).forEach(e=>legsOf(e).forEach(l=>{
      if(l.to===loc){l.cond==='intact'?oI+=l.count:oD+=l.count}
      if(l.from===loc){l.cond==='intact'?oI-=l.count:oD-=l.count}}));
    const days={};
    ents.filter(e=>inR(e)).forEach(e=>legsOf(e).forEach(l=>{
      if(l.to!==loc&&l.from!==loc)return;
      const d=days[e.date]=days[e.date]||{iIn:0,iOut:0,dIn:0,dOut:0};
      const sgn=l.to===loc?'In':'Out';d[(l.cond==='intact'?'i':'d')+sgn]+=l.count}));
    let ci=oI,cd=oD;
    const rows=Object.keys(days).sort().map(dt=>{const x=days[dt];
      const bi=ci,bd=cd;ci+=x.iIn-x.iOut;cd+=x.dIn-x.dOut;
      return `<tr><td class="n">${arDate(dt)}</td><td class="n">${bi}${loc===WH?` <span style="color:var(--debt)">+${bd}ت</span>`:''}</td>
        <td class="n cin">${x.iIn+x.dIn||''}</td><td class="n cout">${x.iOut+x.dOut||''}</td>
        <td class="n" style="font-weight:600">${ci}${loc===WH?` <span style="color:var(--debt)">+${cd}ت</span>`:''}</td></tr>`}).join('');
    const tin=Object.values(days).reduce((t,x)=>t+x.iIn+x.dIn,0);
    const tout=Object.values(days).reduce((t,x)=>t+x.iOut+x.dOut,0);
    const B=(i,d2)=>loc===WH?`${i} سليم · ${d2} تالف`:`${i}`;
    const tbl=`<table><thead><tr><th>اليوم</th><th class="n">رصيد أول اليوم</th>
      <th class="n">وارد</th><th class="n">صادر</th><th class="n">رصيد آخر اليوم</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td>الإجمالي</td><td class="n">${B(oI,oD)}</td>
      <td class="n cin">${tin}</td><td class="n cout">${tout}</td>
      <td class="n">${B(ci,cd)}</td></tr></tfoot></table>`;
    S.print={title:`تقرير البكش اليومي — ${D.nameOf(loc)}`,html:tbl};
    return t+`<div class="eyebrow">تقرير يومي — ${esc(D.nameOf(loc))}</div>
      <div class="card">
      ${loc===WH?'<p class="note" style="margin:0 0 10px">المخزن وحده هو اللي فيه تالف — الرقم الأول سليم والتاني تالف.</p>':''}
      <div class="diff"><span>رصيد أول الفترة</span><b>${loc===WH?`${oI} سليم · ${oD} تالف`:`${oI} صندوق`}</b></div>
      ${rows?`<div class="tscroll">${tbl}</div>`:'<div class="empty">لا حركات</div>'}
      <div class="diff over"><span>رصيد آخر الفترة</span>
        <b>${loc===WH?`${ci} سليم · ${cd} تالف`:`${ci} صندوق`}</b></div></div>`;
  }
  if(S.sub.repbox==='audit'){
    const a=ents.filter(e=>e.op==='audit'&&inR(e)&&(!F.ent||e.locId===F.ent)).sort((x,y)=>y.seq-x.seq);
    const rows=a.map(e=>`<tr><td class="n">${arDate(e.date)}</td><td>${esc(D.nameOf(e.locId))}</td>
      <td class="n">${e.book.intact}/${e.book.damaged}</td><td class="n">${e.counted.intact}/${e.counted.damaged}</td>
      <td class="n" style="color:var(--debt)">${(e.counted.intact-e.book.intact)+(e.counted.damaged-e.book.damaged)}</td></tr>`).join('');
    const dtot=sum(a,e=>(e.counted.intact-e.book.intact)+(e.counted.damaged-e.book.damaged));
    const tbl=`<table><thead><tr><th>التاريخ</th><th>الجهة</th><th class="n">دفتري</th><th class="n">معدود</th>
      <th class="n">الفرق</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td colspan="4">صافي الفروق (${a.length} جرد)</td><td class="n">${dtot}</td></tr></tfoot></table>`;
    S.print={title:"تقرير الجرد",html:tbl};
    return t+`<div class="eyebrow debt">تقارير الجرد</div><div class="card">${rows?`<div class="tscroll">${tbl}</div>`:'<div class="empty">لا عمليات جرد في المدى</div>'}</div>`;
  }
  if(S.sub.repbox==='dmg'){
    /* التالف بإهمال يُقيَّد على السائق للمتابعة، والهلك العادي لا يُحمَّل عليه */
    const per={};
    ents.filter(e=>inR(e)&&e.driverId).forEach(e=>{
      const v=per[e.driverId]=per[e.driverId]||{neg:0,wear:0,ok:0,trips:0};v.trips++;
      legsOf(e).forEach(l=>{
        if(l.cond==='damaged')e.dmgReason==='negligence'?v.neg+=l.count:v.wear+=l.count;
        else v.ok+=l.count})});
    const rows=Object.entries(per).map(([id,v])=>{
      const dr=D.drivers.find(x=>x.id===id),tot=v.ok+v.neg+v.wear;
      return `<tr><td class="tname">${esc(D.nameOf(id))}</td><td class="n">${v.trips}</td>
        <td class="n cin">${v.ok||''}</td>
        <td class="n cout" style="font-weight:600">${v.neg||''}</td>
        <td class="n">${v.wear||''}</td>
        <td class="n">${tot?Math.round((v.neg+v.wear)/tot*100):0}%</td>
        <td class="n cout">${dr?dr.dmg.open:''}</td></tr>`}).join('');
    const V=Object.values(per),TO=sum(V,v=>v.ok),TN=sum(V,v=>v.neg),TW=sum(V,v=>v.wear);
    const TT=TO+TN+TW;
    const tbl=`<table><thead><tr><th>السائق</th><th class="n">حركات</th><th class="n">سليم</th>
      <th class="n">تالف بإهمال</th><th class="n">هلك عادي</th><th class="n">نسبة التلف</th>
      <th class="n">مفتوح الآن</th></tr></thead><tbody>${rows}</tbody>
      <tfoot><tr><td>الإجمالي</td><td class="n">${sum(V,v=>v.trips)}</td><td class="n">${TO}</td>
      <td class="n">${TN}</td><td class="n">${TW}</td>
      <td class="n">${TT?Math.round((TN+TW)/TT*100):0}%</td>
      <td class="n">${sum(D.drivers,d=>d.dmg.open)}</td></tr></tfoot></table>`;
    S.print={title:"تقرير التالف لكل سائق",html:tbl};
    return t+`<div class="eyebrow debt">التالف لكل سائق</div><div class="card">
      ${rows?`<div class="tscroll">${tbl}</div>`:'<div class="empty">لا حركات بكش مرتبطة بسائق في المدى</div>'}
      <p class="note">«تالف بإهمال» يُقيَّد على السائق كعدّاد متابعة — <b>مش مديونية ولا عهدة</b>.
        «هلك عادي» غير محمَّل على أحد. عمود «مفتوح الآن» هو الرصيد غير المصفّى بغضّ النظر عن الفترة،
        وتصفيته من «العمليات ← سائقين ← التالف».</p></div>`;
  }
  /* لم يعد يُستدعى: سجل البكش صار ضمن «كل العمليات» بفلتر النوع */
  const l=ents.filter(e=>inR(e)&&(!F.ent||legsOf(e).some(x=>x.from===F.ent||x.to===F.ent))).sort((a,b)=>b.seq-a.seq);
  /* الوارد والصادر محسوبان بالنسبة لموقع مرجعي (الجهة المختارة أو المخزن) */
  const ref=F.ent||WH;
  const io=e=>{let i=0,o=0;legsOf(e).forEach(x=>{if(x.to===ref)i+=x.count;if(x.from===ref)o+=x.count});return[i,o]};
  let TI=0,TO=0;
  const rows=l.map(e=>{const[i,o]=io(e);TI+=i;TO+=o;
    return `<tr><td class="n">${arDate(e.date)}</td><td>${esc(BOXOP[e.op]||'حركة')}</td>
      <td>${esc(legsTxt(e))}</td><td class="n cin">${i||''}</td><td class="n cout">${o||''}</td>
      <td>${esc(e.note||'')}</td></tr>`}).join('');
  S.print={title:`سجل حركات البكش — الوارد/الصادر بالنسبة لـ ${D.nameOf(ref)}`,
    html:`<table><thead><tr><th>التاريخ</th><th>العملية</th><th>الحركة</th>
      <th class="n">وارد</th><th class="n">صادر</th><th>ملاحظة</th></tr></thead>
    <tbody>${rows}</tbody><tfoot><tr><td colspan="3">الإجمالي (${l.length} حركة)</td>
      <td class="n">${TI}</td><td class="n">${TO}</td><td></td></tr></tfoot></table>`};
  const N=30,show=Math.min(l.length,N*((S.page||0)+1));
  return t+`<div class="eyebrow">كل الحركات (${l.length})</div>`
    +(l.length?l.slice(0,show).map(e=>recHTML(e,(BOXOP[e.op]||'حركة بكش')+(e.auto?' · آلي':''),
        boxFlow(e)+(e.driverId?` · ${D.nameOf(e.driverId)}`:''),boxQtyTxt(e))).join('')
      +(show<l.length?`<button class="more" data-act="more">عرض ${Math.min(N,l.length-show)} حركة أخرى · باقي ${l.length-show}</button>`:'')
      :'<div class="empty">لا حركات</div>');
}
/* سجل شامل: كل حركة في التطبيق، بفلترة بالنوع والجهة والتاريخ،
   وتعديل وحذف مباشرين — بدل «آخر ٦ حركات» في كل شاشة. */
const ALLT={invoice:'فواتير',collection:'تحصيلات',settlement:'تصفيات',opening_cash:'أرصدة افتتاحية',
  trip:'رحلات',driver_advance:'سلف',driver_payment:'تصفية سائق',driver_damage_clear:'تصفية تالف',
  ice_op:'ثلج',factory_payment:'تصفية مصنع',box:'بكش'};
function repAll(){
  const D=S.D,F=S.F,t=S.F.type||'';
  const touches=(e,id)=>!id||e.farmId===id||e.merchantId===id||e.driverId===id||e.factoryId===id
    ||e.entityId===id||e.locId===id||legsOf(e).some(l=>l.from===id||l.to===id);
  const items=S.ledger.filter(e=>e.type!=='void'&&e.type!=='settlement_reversal'
    &&(!t||e.type===t)&&inR(e)&&touches(e,F.ent)).sort((a,b)=>b.seq-a.seq);
  const N=25,show=Math.min(items.length,N*((S.page||0)+1));
  const chips=`<div class="qr" style="margin-bottom:12px">
    <button data-act="allType" data-t="" aria-selected="${!t}">الكل (${S.ledger.filter(e=>e.type!=='void'&&inR(e)).length})</button>
    ${Object.entries(ALLT).map(([k,l])=>{const n=S.ledger.filter(e=>e.type===k&&inR(e)).length;
      return n?`<button data-act="allType" data-t="${k}" aria-selected="${t===k}">${l} (${n})</button>`:''}).join('')}</div>`;
  const T={invoice:'فاتورة',collection:'تحصيل',settlement:'تصفية مزرعة',opening_cash:'رصيد افتتاحي',
    trip:'رحلة',driver_advance:'سلفة',driver_payment:'تصفية سائق',driver_damage_clear:'تصفية تالف',
    ice_op:'ثلج',factory_payment:'تصفية مصنع'};
  const meta=e=>{
    if(e.type==='box')return boxFlow(e)+(e.driverId?` · ${D.nameOf(e.driverId)}`:'');
    if(e.type==='invoice')return `${D.nameOf(e.merchantId)} ← ${D.nameOf(e.farmId)} · ${e.boxes} ص`;
    if(e.type==='collection')return D.nameOf(e.merchantId);
    if(e.type==='settlement')return `${D.nameOf(e.farmId)} · ${(e.coveredIds||[]).length} فاتورة`;
    if(e.type==='trip')return `${D.nameOf(e.driverId)} · ${D.nameOf(e.routeId)||''}`;
    if(e.type==='ice_op')return `${D.nameOf(e.factoryId)} → ${D.nameOf(e.farmId)} · ${e.qty} بلاطة`;
    if(e.type==='driver_damage_clear')return `${D.nameOf(e.driverId)} · ${e.count} صندوق`;
    return D.nameOf(e.entityId||e.driverId||e.factoryId||e.merchantId)};
  const val=e=>e.type==='box'?boxQtyTxt(e)
    :e.type==='trip'?money(e.fare??e.cost)
    :e.type==='settlement'?money(e.payable)
    :e.type==='ice_op'?money((+e.qty||0)*(+e.unitPrice||0))
    :e.type==='driver_damage_clear'?e.count+' ص'
    :e.amount!==undefined?money(e.amount):'';
  const title=e=>e.type==='box'?(BOXOP[e.op]||'بكش')+(e.auto?' · آلي':''):(T[e.type]||e.type);
  S.print={title:"سجل العمليات",html:`<table><thead><tr><th>التاريخ</th><th>العملية</th><th>البيان</th><th class="n">القيمة</th></tr></thead><tbody>
    ${items.map(e=>`<tr><td>${arDate(e.date)}</td><td>${esc(title(e))}</td><td>${esc(meta(e))}</td><td class="n">${esc(String(val(e)))}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4">${items.length} حركة</td></tr></tfoot></table>`};
  return chips+`<div class="eyebrow">${items.length} حركة</div>`
    +(items.length?items.slice(0,show).map(e=>recHTML(e,title(e),meta(e),val(e))).join('')

/* تُسجَّل كحركتين في السجل: نقدية وبكش — لا كخانة في البطاقة */
async function postOpening(ent,p){
  const d=p.openDate||todayISO();
  const cash=Math.abs(+p.openCash||0)*(+p.openSign||1);
  /* عهدة البكش سليم فقط، وتقبل السالب: بكش يخصّ الجهة محتفظين به عندنا */
  const box=Math.abs(Math.round(+p.openIntact||0))*(+p.openBoxSign||1);
  if(cash)await append({type:'opening_cash',date:d,entityId:ent.id,entityType:ent.type,
    amount:cash,note:'رصيد افتتاحي'});
  if(box){
    const params={locId:ent.id,oIntact:Math.abs(box),dir:box<0?-1:1};
    const legs=box>0?[{from:'#OPEN',to:ent.id,cond:'intact',count:box}]
                    :[{from:ent.id,to:'#OPEN',cond:'intact',count:-box}];
    await append({type:'box',op:'opening_box',date:d,legs,params,note:'رصيد بكش افتتاحي'});
  }
  if(cash||box)toast("سُجّل الرصيد الافتتاحي كحركة مؤرَّخة","ok");
}

async function doWipe(){
  const el=$('#wipeWord');
  if(((el&&el.value)||'').trim()!=='تصفية')return toast("اكتب كلمة «تصفية» بالضبط في الخانة","err");
  if(!S.wipe.backedUp && !await ask("بدون نسخة احتياطية",
    "لسه ما نزّلتش نسخة في الخطوة ٢.\nلو كملت، البيانات هتضيع للأبد ومفيش طريقة ترجّعها.",
    {ok:"أكمل بدون نسخة",cancel:"رجوع",danger:1}))return;
  if(!await requireOwner("تصفية الحسابات نهائياً"))return;
  const kind=S.wipe.kind,n=S.ledger.length,m=S.entities.length;
  try{
    /* نوثّق التصفية في meta قبل المسح: التاريخ والعدد وبصمة آخر حركة —
       فيبقى أثر للمراجعة حتى بعد اختفاء السجل نفسه. */
    const log=(await getMeta('wipeLog'))||[];
    log.push({at:new Date().toISOString(),kind,ledger:n,entities:kind==='all'?m:0,
      tip:S.chainTip||'',dev:S.devId});
    await setMeta('wipeLog',log.slice(-20));
    await rq(st('ledger','readwrite').clear());
    if(kind==='all')await rq(st('entities','readwrite').clear());
    S.chainTip='';S.openRec=null;S.lastReceipt=null;S.form={};S.diag=null;S.drill={};S.page=0;
    closeSheet();S.tab='home';S.toTop=true;
    await refresh();
    toast(kind==='all'?`تم المسح: ${n} حركة و${m} جهة`:`تم مسح ${n} حركة — الجهات محفوظة`,"ok");
  }catch(e){toast("تعذّرت التصفية: "+(e.message||''),"err")}
}

function logList(types,title,limit=6){
  const D=S.D;
  const items=S.ledger.filter(e=>types.includes(e.type)).sort((a,b)=>b.seq-a.seq).slice(0,limit);
  if(!items.length)return '';
  const T={invoice:'فاتورة',collection:'تحصيل',trip:'رحلة',driver_advance:'سلفة',driver_payment:'تصفية سائق',
    factory_payment:'تصفية مصنع',ice_op:'ثلج',opening_cash:'رصيد افتتاحي',
    driver_damage_clear:'تصفية تالف'};
  const meta=e=>{
    if(e.type==='invoice')return `${D.nameOf(e.merchantId)} ← ${D.nameOf(e.farmId)} · ${e.boxes} ص`;
    if(e.type==='collection')return D.nameOf(e.merchantId);
    if(e.type==='opening_cash')return D.nameOf(e.entityId);
    if(e.type==='trip')return `${D.nameOf(e.driverId)} · ${D.nameOf(e.routeId)||e.destination||''}`;
    if(e.type==='ice_op')return `${D.nameOf(e.factoryId)} → ${D.nameOf(e.farmId)} · ${e.qty} بلاطة`;
    if(e.type==='driver_damage_clear')return `${D.nameOf(e.driverId)} · ${e.count} صندوق`;
    return D.nameOf(e.driverId||e.factoryId)};
  const val=e=>e.type==='trip'?money(e.fare??e.cost)
    :e.type==='ice_op'?money((+e.qty||0)*(+e.unitPrice||0))
    :e.type==='driver_damage_clear'?'':money(e.amount);
  return `<div class="eyebrow">${title}</div>`
    +items.map(e=>recHTML(e,T[e.type]||e.type,meta(e),val(e))).join('');
}

function wire(root){
  $$('.seg',root).forEach(s=>s.addEventListener('click',ev=>{
    const b=ev.target.closest('button[data-sub]');if(!b)return;
    S.sub[s.dataset.seg]=b.dataset.sub;
    if(s.dataset.seg==='fin')S.form.settle=null;
    if(s.dataset.seg==='rep'){S.F.ent="";S.page=0}
    if(s.dataset.seg==='acct')S.page=0;
    if(s.dataset.seg==='box')S.sub.boxop='';
    if(s.dataset.seg==='set'||s.dataset.seg==='setg'){S.setq='';S.setp=0}
    if(s.dataset.seg==='box')S.sub.boxop='';
    render()}));
  $$('form[data-form]',root).forEach(f=>f.addEventListener('submit',onSubmit));

  const mp=$('[data-role=mpick]',root);
  if(mp)mp.addEventListener('change',()=>{
    const m=S.D.merchants.find(x=>x.id===mp.value),h=$('[data-role=mhint]',root);

  const ap=$('[data-role=apick]',root);

    if(r)$('[data-role=fare]',root).value=+r.fare||0});
  const fp=$('[data-role=facPick]',root);

    if(f)$('[data-role=price]',root).value=+f.price||0});

let _lastEv=null;
function onClick(ev){
  /* لو تعدّدت المستمعات لأي سبب، لا يُنفَّذ الأمر إلا مرة واحدة لكل ضغطة */
  if(ev===_lastEv)return; _lastEv=ev;
  const pc=ev.target.closest('.pchip[data-pv]');
  if(pc){const box=pc.closest('.pick');if(box)return setPick(box.id,pc.dataset.pv)}
  const qv=ev.target.closest('[data-qv]');
  if(qv){const box=qv.closest('[data-qn]'),f=qv.closest('form');
    const el=f&&f.elements[box.dataset.qn];
    if(el){el.value=qv.dataset.qv;
      box.querySelectorAll('[data-qv]').forEach(x=>x.setAttribute('aria-pressed',String(x===qv)))}
    return;}
  const wc=ev.target.closest('[data-wipe]');
  if(wc){S.wipe.kind=wc.dataset.wipe;return drawWipe()}
  const sv=ev.target.closest('[data-sv]');
  if(sv){const fld=sv.closest('.field');
    sv.parentElement.querySelectorAll('[data-sv]').forEach(x=>x.setAttribute('aria-pressed',String(x===sv)));
    const h=fld&&fld.querySelector('input[name="'+(sv.dataset.for||'openSign')+'"]');
    if(h)h.value=sv.dataset.sv;
    return;}
  const gb=ev.target.closest('[data-pkg]');
  if(gb){(S.pkg||(S.pkg={}))[gb.dataset.pkg]=gb.dataset.g;return render()}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  const go=(tab,sub)=>{S.tab=tab;if(sub)Object.assign(S.sub,sub);S.toTop=true;render()};
  switch(a){
    case 'pkOpen':return openPicker(b.dataset.pk);
    case 'saveAgain':{const f=b.closest('form');if(!f)return;S.again=true;
      if(f.requestSubmit)f.requestSubmit();
      else f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));return}

}

function wireSettle(root){
  const f=$('form[data-form=settle]',root),g=r=>$('[data-role='+r+']',f);
  f.farmId.addEventListener('change',()=>{const x=S.D.farms.find(y=>y.id===f.farmId.value);
    g('total').value=x?Math.round(x.cycleTotal*100)/100:0;S.form.settle={...(S.form.settle||{}),commissionTouched:false};syncSettle()});
  /* لا إكمال آلي إلى ١٠٠: الرقمان مستقلان (٥/٧٠ نسبة صحيحة في السوق) */
  ['office','farmRatio'].forEach(r=>g(r).addEventListener('input',()=>{
    S.form.settle={...(S.form.settle||{}),commissionTouched:false};syncSettle()}));
  g('commission').addEventListener('input',()=>{S.form.settle={...(S.form.settle||{}),commissionTouched:true};syncSettle()});
  ['expenses','prevDebt'].forEach(r=>g(r).addEventListener('input',syncSettle));
  syncSettle();
}
function syncSettle(){
  const f=$('form[data-form=settle]');if(!f)return;const g=r=>$('[data-role='+r+']',f);
  const touched=!!(S.form.settle&&S.form.settle.commissionTouched);
  const x=S.D.farms.find(y=>y.id===f.farmId.value);
  const raw={total:+g('total').value||0,office:+g('office').value||0,farmRatio:+g('farmRatio').value||0,
    commission:+g('commission').value||0,expenses:+g('expenses').value||0,prevDebt:+g('prevDebt').value||0,commissionTouched:touched};
  const c=calcSettlement(raw);
  if(!touched)g('commission').value=c.commission;
  g('net').value=Math.round(c.net*100)/100;g('payable').value=Math.round(c.payable*100)/100;
  $('[data-role=cyc]',f).textContent=x?`${x.cycleCount} فاتورة · ${x.cycleBoxes} صندوق في الدورة`:"اختر مزرعة.";
  const pe=$('[data-role=pct]',f);
  if(pe)pe.innerHTML=c.pct>0
    ?`<b class="num">${raw.office} ÷ ${raw.farmRatio}</b> = <b class="num">${Math.round(c.pct*1000)/1000}%</b>
       · العمولة قبل التقريب <b class="num">${money(raw.total*c.pct/100)}</b>`
    :"اكتب بسطاً ومقاماً أكبر من صفر.";
  $('[data-role=tape]',f).innerHTML=(x&&c.total>0)?tapeHTML({farmName:x.name,farmId:x.id,date:f.date.value,count:x.cycleCount,boxes:x.cycleBoxes,...c}):'';
  S.form.settle={...raw,farmId:f.farmId.value,date:f.date.value};
}
function wireAudit(f){
  const upd=()=>{const loc=f.locId.value,out=$('[data-role=adiff]',f);
    /* خانة التالف تظهر للمخزن وحده — الجهات لا تحمل تالفاً */
    const dw=$('[data-role=cdmg]',f);
    if(dw)dw.style.display=(loc===WH)?'':'none';
    if(loc!==WH&&f.cDamaged)f.cDamaged.value=0;
    if(!loc)return out.innerHTML='';
    const b=S.D.boxOf(loc),ci=+f.cIntact.value||0,cd=+f.cDamaged.value||0,di=ci-b.intact,dd=cd-b.damaged;
    const L=(l,bk,ct,d)=>`<div class="diff ${d<0?'short':d>0?'over':''}"><span>${l} · دفتري <b>${bk}</b> · معدود <b>${ct}</b></span>
      <b>${d===0?'مطابق':(d<0?'عجز '+(-d):'زيادة '+d)}</b></div>`;
    out.innerHTML=L('سليم',b.intact,ci,di)+(loc===WH?L('تالف',b.damaged,cd,dd):'')};
  f.locId.addEventListener('change',upd);f.cIntact.addEventListener('input',upd);f.cDamaged.addEventListener('input',upd);upd();
}

/* لوحة المفاتيح العربية تكتب ٠١٢٣ — نطبّعها في الحقول الرقمية فقط حتى لا تصير NaN */
const AR2EN=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
  .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[،٫]/g,'.');
const D0=id=>S.D.nameOf(id);
const readForm=f=>{const o={};[...f.elements].forEach(el=>{
  if(!el.name)return;
  const numeric=el.type==='number'||el.inputMode==='decimal'||el.inputMode==='numeric';
  o[el.name]=numeric?AR2EN(el.value).trim():el.value;});return o};
async function onSubmit(ev){
  ev.preventDefault();const f=ev.currentTarget,kind=f.dataset.form,p=readForm(f);
  /* حماية من الضغط المزدوج: نفس الفاتورة كانت تُسجَّل مرتين على الشبكات البطيئة */

    if(kind==='entity'){
      const t=f.dataset.etype;

      if(S.entities.some(e=>e.type===t&&!e.deleted&&e.name===p.name.trim()))return toast("الاسم مسجَّل بالفعل","err");
      const ent=await putEntity({id:uid(),type:t,name:p.name.trim(),place:p.place||"",
        phone:(p.phone||"").replace(/\s/g,""),price:+p.price||0,fare:+p.fare||0,createdAt:new Date().toISOString()});
      await postOpening(ent,p);
      f.reset();return toast("تمت الإضافة","ok")}
    if(kind==='company'){
      S.co={name:p.name||"دفتر السماكة",phone:(p.phone||"").replace(/[^\d]/g,""),logo:S.co.logo||""};
      await setMeta('company',S.co);await refresh();return toast("تم حفظ بيانات الشركة","ok")}
    if(kind==='invoice'){
      if(!p.farmId||!p.merchantId)return toast("اختر المزرعة والمبيع","err");
      const amt=+p.amount||0;
      const inv=await append({type:'invoice',date:p.date,farmId:p.farmId,merchantId:p.merchantId,
        driverId:p.driverId||null,boxes:Math.max(0,Math.round(+p.boxes||0)),amount:amt,note:p.note});
      await syncInvoiceBox(inv,null);
      /* «واحدة تانية» تُبقي المزرعة والسائق والتاريخ للفاتورة التالية */
      const again=S.again;S.again=false;
      S.invKeep=again?{date:p.date,farmId:p.farmId,driverId:p.driverId||''}:{date:p.date};
      f.reset();render();
      return toast(again?`تم · ${D0(p.farmId)} جاهزة للفاتورة اللي بعدها`
        :(amt>0?(S.autoBox&&inv.boxes>0?`تم التسجيل + ترحيل ${inv.boxes} صندوق`:"تم تسجيل الفاتورة")
        :"اتحفظت كمسوّدة — اكتب المبلغ من «مسوّدات»"),"ok")}
    if(kind==='collection'){
      if(!p.merchantId)return toast("اختر المبيع","err");
      if(+p.amount<=0)return toast("المبلغ أكبر من صفر","err");

      f.reset();return toast("تم تسجيل التحصيل","ok")}
    if(kind==='trip'){
      if(!p.driverId||!p.routeId)return toast("اختر السائق والرحلة","err");
      await append({type:'trip',date:p.date,driverId:p.driverId,routeId:p.routeId,fare:+p.fare||0,note:p.note});
      f.reset();return toast("تم تسجيل الرحلة","ok")}
    if(kind==='driver_advance'||kind==='driver_payment'||kind==='factory_payment'){
      const key=kind==='factory_payment'?'factoryId':'driverId';
      if(!p[key])return toast("اختر الجهة","err");
      if(+p.amount<=0)return toast("المبلغ أكبر من صفر","err");
      await append({type:kind,date:p.date,[key]:p[key],amount:+p.amount,note:p.note});
      f.reset();return toast("تم التسجيل","ok")}
    if(kind==='ice_op'){
      if(!p.factoryId||!p.farmId)return toast("اختر المصنع والمزرعة","err");

      await append({type:'ice_op',date:p.date,factoryId:p.factoryId,farmId:p.farmId,
        qty:Math.round(+p.qty),unitPrice:+p.unitPrice||0,note:p.note});

    if(kind==='whopen'){
      const oi=Math.round(+p.oIntact||0),od=Math.round(+p.oDamaged||0);

      const params={locId:WH,oIntact:oi,oDamaged:od};
      await append({type:'box',op:'opening_box',date:p.date||todayISO(),
        legs:buildLegs('opening_box',params),params,note:'رصيد المخزن الافتتاحي'});
      f.reset();return toast("تم تسجيل رصيد المخزن","ok")}
    if(kind==='dmgclear'){

    if(kind==='audit')return doAudit(p,f);

/*
  ترحيل بكش الفاتورة آلياً.
  الفاتورة مالية، وحركة البكش مخزنية — الفصل باقٍ كما هو: نُنشئ حركة sale_move
  مستقلة مربوطة بالفاتورة عبر invoiceId مع علامة auto، فتُحسب في دفتر البكش وحده
  ولا تدخل أي معادلة مالية. أي تعديل أو حذف للفاتورة يسحب معه الحركة المرتبطة.
  لا نمرّ على doBox هنا لتفادي سؤال «الرصيد سيصبح سالباً» أثناء تسجيل فاتورة سريع؛
  الرصيد السالب يظهر في شاشة الأرصدة ويُصحَّح بجرد.
*/
async function syncInvoiceBox(inv,oldBoxId){
  const n=Math.round(+inv.boxes||0);
  if(!S.autoBox||n<=0){ if(oldBoxId) await append({type:'void',voidOf:oldBoxId,date:todayISO()}); return }
  const p={farmId:inv.farmId,merchantId:inv.merchantId,count:n,date:inv.date,driverId:inv.driverId||''};
  const rec={type:'box',op:'sale_move',date:inv.date,legs:buildLegs('sale_move',p),params:p,
    driverId:inv.driverId||null,invoiceId:inv.id,auto:true,note:'ترحيل آلي من الفاتورة'};
  if(oldBoxId) rec.replaces=oldBoxId;
  await append(rec);
}
async function doBox(op,p,f,replaces){
  const legs=buildLegs(op,p);
  if(!legs.length)return toast("اكتب عدداً أكبر من صفر","err");
  if(legs.some(l=>!l.from||!l.to))return toast("اختر الجهات المطلوبة","err");
  if(legs.some(l=>l.from===l.to))return toast("المصدر والوجهة لا يصحّ أن يكونا نفس الجهة","err");
  /* الرصيد السالب حالة مشروعة: بكش سلفة عند المبيع، أو صرف قبل تسجيل الشراء.
     لا نمنع ولا نسأل — نعرض الرصيد الناتج فقط ليراه المستخدم. */
  await append({type:'box',op,date:p.date||todayISO(),legs,params:p,
    driverId:p.driverId||null,dmgReason:p.dmgReason||null,
    invoiceId:p.invoiceId||null,cost:+p.cost||0,note:p.note,replaces});
  if(f)f.reset();toast((BOXOP[op]||'حركة')+" — تم","ok");
}
/*
  الجرد: العجز يخرج من الجهة إلى #LOSS ويظهر فاقداً عليها،
  والزيادة تدخل من #EXT. نحفظ المعدود والدفتري داخل الحركة للمراجعة.
*/
async function doAudit(p,f){
  if(!p.locId)return toast("اختر الجهة","err");
  const b=S.D.boxOf(p.locId),ci=Math.max(0,Math.round(+p.cIntact||0)),cd=Math.max(0,Math.round(+p.cDamaged||0));
  const di=ci-b.intact,dd=cd-b.damaged;
  if(!di&&!dd)return toast("الجرد مطابق للدفتر","ok");
  const legs=[];
  if(di<0)legs.push({from:p.locId,to:'#LOSS',cond:'intact',count:-di});
  if(di>0)legs.push({from:'#EXT',to:p.locId,cond:'intact',count:di});
  if(dd<0)legs.push({from:p.locId,to:'#LOSS',cond:'damaged',count:-dd});
  if(dd>0)legs.push({from:'#EXT',to:p.locId,cond:'damaged',count:dd});
  const parts=[];if(di)parts.push((di<0?"عجز":"زيادة")+" سليم "+Math.abs(di));if(dd)parts.push((dd<0?"عجز":"زيادة")+" تالف "+Math.abs(dd));
  if(!await ask("اعتماد جرد «"+S.D.nameOf(p.locId)+"»",parts.join("\n")+"\nالعجز يُقيَّد فاقداً على الجهة.",{ok:"اعتماد الجرد"}))return;
  if(!await requireOwner("اعتماد جرد"))return;
  await append({type:'box',op:'audit',date:p.date||todayISO(),locId:p.locId,legs,params:p,

async function onSheet(ev){
  ev.preventDefault();const f=ev.currentTarget,p=readForm(f),id=f.dataset.id;
  const kind=f.dataset.sheet;
  try{
    if(kind==='amountOnly'){
      const e=S.ledger.find(x=>x.id===id);
      const amt=+AR2EN(p.amount||'')||0;
      if(amt<=0)return toast("اكتب مبلغاً أكبر من صفر","err");
      const n={...e,amount:amt,replaces:id};delete n.seq;delete n.id;
      await append(n);closeSheet();return toast("تم — الفاتورة دخلت الحسابات","ok")}
    if(kind==='openBal'){const e=S.entities.find(x=>x.id===id);
      await postOpening(e,p);closeSheet();return}
    if(kind==='editEnt'){const e=S.entities.find(x=>x.id===id);
      await putEntity({...e,...p,price:+p.price||0,fare:+p.fare||0});closeSheet();return toast("تم الحفظ","ok")}
    if(kind==='editOp'){
      const e=S.ledger.find(x=>x.id===id);
      if(e.type==='box'){await doBox(e.op,p,null,id);closeSheet();return}
      const n={...e,...p,replaces:id};delete n.seq;delete n.id;
      ['amount','boxes','fare','qty','unitPrice'].forEach(k=>{if(k in n)n[k]=+n[k]||0});
      const rec=await append(n);
      if(e.type==='invoice'){
        const old=S.ledger.find(x=>x.type==='box'&&x.auto&&x.invoiceId===id&&!S.D.dead.has(x.id));
        await syncInvoiceBox(rec,old?.id);
      }
      closeSheet();return toast("تم حفظ التعديل","ok")}
  }catch(err){console.error(err);toast("تعذّر الحفظ","err")}
}

async function setPin(){

/* تذكير النسخ: يحسب عمر آخر نسخة وعدد الحركات بعدها */
function bkAge(){
  if(!S.bk.last)return{days:999,since:S.ledger.length};
  const d=Math.floor((Date.now()-new Date(S.bk.last).getTime())/864e5);
  return{days:d,since:S.ledger.length-(S.bk.count||0)};
}
function backupNudge(){
  const a=bkAge();
  if(S.bk.auto&&a.since>=(S.bk.every||50)){exportJSON(true);return}
  if(a.since&&a.since%25===0)toast(`مرّت ${a.since} حركة بلا نسخة احتياطية`,"err");
}
/* فحص سلامة السجل: نعيد حساب السلسلة ونقارنها بالمخزَّن */
async function verifyChain(){
  let prev="",bad=null,unsigned=0;
  for(const e of [...S.ledger].sort((a,b)=>a.seq-b.seq)){
    if(!e.hash){unsigned++;prev=prev;continue}
    const h=await sha((e.prevHash||"")+bodyOf(e));
    if(e.prevHash!==prev||h!==e.hash){bad=e;break}
    prev=e.hash;
  }
  S.diag={kind:'chain',ok:!bad,bad,unsigned,total:S.ledger.length};
  render();
  toast(bad?`عبث محتمل عند الحركة رقم ${bad.seq}`:"السلسلة سليمة",bad?"err":"ok");
}

/* ============ كشف الحساب المجمّع ============
   ورقة واحدة تجمع النقدية والعهدة والتالف — تُطبع وتُوقَّع عند التسليم،
   بدل ثلاث شاشات منفصلة يقارن بينها المستلم بنفسه. */
function cashRows(id,type){
  const D=S.D,L=D.live.filter(e=>inR(e)),R=[];
  const push=(e,label,detail,dr,cr)=>R.push({date:e.date,seq:e.seq,label,detail,dr,cr});
  L.forEach(e=>{
    if(e.type==='opening_cash'&&e.entityId===id){
      const a=+e.amount||0;push(e,'رصيد افتتاحي',e.note||'—',a>0?a:0,a<0?-a:0);return}
    if(type==='merchant'){
      if(e.type==='invoice'&&e.merchantId===id&&+e.amount>0)push(e,'فاتورة',D.nameOf(e.farmId)+' · '+e.boxes+' ص',+e.amount,0);
      if(e.type==='collection'&&e.merchantId===id)push(e,'تحصيل',e.note||'—',0,+e.amount);
    }else if(type==='farm'){
      if(e.type==='invoice'&&e.farmId===id&&+e.amount>0)push(e,'فاتورة',D.nameOf(e.merchantId)+' · '+e.boxes+' ص',+e.amount,0);
      if(e.type==='settlement'&&e.farmId===id)push(e,'تصفية','مستحق '+money(e.payable),0,+e.total);
    }else if(type==='driver'){
      if(e.type==='trip'&&e.driverId===id)push(e,'رحلة',D.nameOf(e.routeId)||'—',+(e.fare??e.cost)||0,0);
      if(e.type==='driver_advance'&&e.driverId===id)push(e,'سلفة',e.note||'—',0,+e.amount);
      if(e.type==='driver_payment'&&e.driverId===id)push(e,'تصفية',e.note||'—',0,+e.amount);
    }else if(type==='ice'){
      if(e.type==='ice_op'&&e.factoryId===id)push(e,'توريد ثلج',e.qty+' بلاطة × '+money(e.unitPrice),
        (+e.qty||0)*(+e.unitPrice||0),0);
      if(e.type==='factory_payment'&&e.factoryId===id)push(e,'تصفية',e.note||'—',0,+e.amount);
    }
  });
  return R.sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq);
}
function boxRows(id){
  const D=S.D;
  return D.live.filter(e=>e.type==='box'&&inR(e)&&legsOf(e).some(l=>l.from===id||l.to===id))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.seq-b.seq)
    .map(e=>{let i=0,o=0;const other=new Set();
      legsOf(e).forEach(l=>{
        if(l.to===id){i+=l.count;if(l.from!==id&&l.from!=='#ADJ')other.add(D.nameOf(l.from))}
        if(l.from===id){o+=l.count;if(l.to!==id&&l.to!=='#ADJ')other.add(D.nameOf(l.to))}});
      return{date:e.date,label:(BOXOP[e.op]||'حركة')+(e.auto?' (آلي)':''),
        detail:[...other].join(' · ')||'—',in:i,out:o}});
}

function combinedText(id){

/* ============ النسخ الاحتياطي ============ */
function exportJSON(auto){
  const b=new Blob([JSON.stringify({v:3,exportedAt:new Date().toISOString(),device:S.devId,
    company:S.co,security:{lockedUntil:S.sec.lockedUntil},entities:S.entities,ledger:S.ledger},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download=(S.co.name||"fish-ledger").replace(/\s/g,'-')+"-"+todayISO()+(auto?"-تلقائي":"")+".json";a.click();
  URL.revokeObjectURL(a.href);
  S.bk={...S.bk,last:new Date().toISOString(),count:S.ledger.length};
  setMeta('backup',S.bk).then(()=>render());
  toast(auto?"نسخة احتياطية تلقائية":"تم تنزيل النسخة","ok");
}
function importJSON(){
  const i=document.createElement('input');i.type='file';i.accept='application/json';
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{
      const d=JSON.parse(await f.text());
      if(!d.ledger||!d.entities)throw new Error("ملف غير صالح");
      if(!await requireOwner("استعادة نسخة"))return;
      if(!await ask("استعادة نسخة",`${d.ledger.length} حركة و${d.entities.length} جهة.\nسيُدمج مع الموجود — الحركات المكرّرة تُتجاهل.`,{ok:"استعادة"}))return;
      const known=new Set(S.ledger.map(x=>x.id));
      const tx=DBH.transaction(['ledger','entities'],'readwrite');
      d.entities.forEach(e=>tx.objectStore('entities').put(cleanObj(e)));
      d.ledger.filter(e=>!known.has(e.id)).forEach(e=>{const {seq,...rest}=e;tx.objectStore('ledger').add(rest)});
      tx.oncomplete=async()=>{if(d.company)await setMeta('company',d.company);await refresh();toast("تمت الاستعادة","ok")};
    }catch(err){toast("تعذّرت الاستعادة: "+err.message,"err")}};
  i.click();
}

/* ============ الإقلاع ============ */
/* مستمعان معلَّقان مرة واحدة فقط — التعليق داخل render يكرّر تنفيذ الأوامر */
/* مستمع واحد على المستند كله: أي زر يحمل data-act يعمل أينما كان،
   فلا يتكرر خطأ «زر خارج الحاوية لا يستجيب». */
document.addEventListener('click',onClick);
document.addEventListener('keydown',e=>{if(e.key==='Escape')fabToggle(false)});
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('button[data-tab]');if(!b)return;
  S.tab=b.dataset.tab;S.toTop=true;render()});
/* ============ التثبيت كتطبيق ============
   كروم بيفرّق بين «اختصار» (يفتح في تبويب) و«تثبيت تطبيق» (يفتح لوحده
   وسط تطبيقات الجهاز). التثبيت الحقيقي بيحتاج: رابط https + مانيفست سليم
   + عامل خدمة له معالج fetch. لما تتحقق الشروط بيطلق المتصفح حدث
   beforeinstallprompt، فنمسكه ونعرض زر تثبيت داخل التطبيق. */
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches
  ||matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;S.canInstall=true;
  if(S.D)render()});
addEventListener('appinstalled',()=>{installEvt=null;S.canInstall=false;
  toast("تم تثبيت التطبيق — افتحه من شاشة الجهاز","ok");if(S.D)render()});
async function doInstall(){
  if(installEvt){
    installEvt.prompt();
    const r=await installEvt.userChoice;
    installEvt=null;S.canInstall=false;render();
    if(r.outcome!=='accepted')toast("تقدر تثبّته في أي وقت من الإعدادات","ok");
    return;
  }
  /* المتصفح لم يطلق الحدث: إمّا آيفون (لا يدعمه) أو الشروط غير مكتملة */
  const file=location.protocol==='file:';
  await ask("تثبيت التطبيق على الجهاز",
    file?"أنت فاتح الملف مباشرة من الجهاز، والتثبيت مستحيل في الحالة دي.\n\nارفع الملفات على GitHub Pages وافتح الرابط من المتصفح، وبعدها هيظهر خيار التثبيت."
    :isIOS()?"على آيفون:\n\n١. افتح الصفحة في Safari (مش كروم).\n٢. اضغط زر المشاركة ⬆️ تحت.\n٣. اختر «إضافة إلى الشاشة الرئيسية».\n\nهيفتح بملء الشاشة من غير شريط المتصفح."
    :"على أندرويد (Chrome):\n\n١. اضغط قائمة ⋮ فوق يمين.\n٢. اختر «تثبيت التطبيق» — مش «إضافة إلى الشاشة الرئيسية».\n\nلو الخيار مش ظاهر: تأكد إن الرابط https، وحدّث الصفحة، واستنى ثواني.",
    {ok:"تمام",cancel:"إغلاق"});
}
/* عامل الخدمة: بدونه لا تثبيت حقيقي ولا عمل مضمون بدون إنترنت */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js',{scope:'./'}).then(reg=>{
    S.swReg=true;
    reg.addEventListener('updatefound',()=>{
      const w=reg.installing;
      w&&w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller)
          toast("فيه تحديث جاهز — اقفل التطبيق وافتحه","ok")})})
  }).catch(err=>{S.swErr=err.message;
    console.warn('SW register failed:',err);});
}

/* تشخيص التثبيت: يفحص شروط كروم واحداً واحداً ويقول أيّها لم يتحقق.
   بدونه يظل المستخدم يخمّن لماذا يظهر «اختصار» بدل «تطبيق». */
/* تحديث قسري: يلغي عامل الخدمة ويمسح الكاش ثم يعيد التحميل.
   IndexedDB خارج نطاق المسح تماماً، فالبيانات آمنة. */
async function forceUpdate(){
  if(!await ask("تحديث التطبيق",
    "هيتمسح الملفات المخزَّنة وتُحمَّل النسخة الجديدة من السيرفر.\nبياناتك محفوظة ولن تتأثر.",
    {ok:"تحديث"}))return;
  try{
    if('serviceWorker' in navigator){
      const rs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(rs.map(r=>r.unregister()));
    }
    if(globalThis.caches){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
    toast("تم المسح — جارٍ إعادة التحميل","ok");
    setTimeout(()=>location.reload(),700);
  }catch(e){toast("تعذّر التحديث: "+(e.message||''),"err")}
}
async function installDiag(){
  const R=[],add=(n,ok,hint,act)=>R.push({n,ok,hint:ok?'':hint,act:ok?null:act});
  const https=location.protocol==='https:'||location.hostname==='localhost';
  add("الرابط آمن (https)",https,"لازم ترفع الملفات على GitHub Pages — الفتح المحلي لا يسمح بالتثبيت إطلاقاً");
  let man=null,mUrl='';
  try{
    const l=document.querySelector('link[rel=manifest]');
    mUrl=l.href; const r=await fetch(mUrl,{cache:'no-store'});
    add("ملف manifest.json يتحمّل",r.ok,"الملف غير مرفوع أو مساره غلط");
    if(r.ok){man=await r.json();
      add("الاسم والعرض المستقل",!!(man.name&&man.display==='standalone'),"المانيفست ناقص");
      const need=['192x192','512x512'];
      add("أيقونتا ١٩٢ و ٥١٢",need.every(z=>(man.icons||[]).some(i=>i.sizes===z)),"المانيفست ناقص أيقونات");
      let iok=true,bad='';
      for(const ic of (man.icons||[])){
        if(ic.src.startsWith('data:'))continue;   /* المضمَّنة لا تحتاج رفعاً */
        const u=new URL(ic.src,mUrl).href;
        try{const rr=await fetch(u,{cache:'no-store'});if(!rr.ok){iok=false;bad=u}}catch(e){iok=false;bad=u}}
      add("ملفات الأيقونات مرفوعة",iok,
        "ناقص: "+bad.replace(location.origin,'')+" — ارفع مجلد icons كامل. (فيه أيقونات مضمَّنة احتياطية فالتثبيت لسه ممكن)");
      const sc=new URL(man.scope||'./',mUrl).pathname;
      add("النطاق يطابق الرابط",location.pathname.startsWith(sc),"scope في المانيفست لا يغطي رابط الصفحة");
    }
  }catch(e){add("ملف manifest.json يتحمّل",false,e.message)}
  if('serviceWorker' in navigator){
    let reg=null;try{reg=await navigator.serviceWorker.getRegistration()}catch(e){}
    let swUrl=new URL('sw.js',location.href).href,swOk=false;
    try{const r=await fetch(swUrl,{cache:'no-store'});swOk=r.ok}catch(e){}
    add("ملف sw.js مرفوع",swOk,"ناقص: "+swUrl.replace(location.origin,'')+" — ارفعه في نفس مجلد index.html");
    add("عامل الخدمة مسجَّل",!!reg,S.swErr
      ||(swOk?"الملف موجود لكن لم يُسجَّل — اضغط «سجّل عامل الخدمة الآن» تحت":"ارفع sw.js أولاً"),
      !reg&&swOk?'swRetry':null);
    add("عامل الخدمة يتحكّم بالصفحة",!!navigator.serviceWorker.controller,"حدّث الصفحة مرة واحدة ثم أعد الفحص");
  }else add("المتصفح يدعم عامل الخدمة",false,"استخدم Chrome على أندرويد أو Safari على آيفون");
  add("المتصفح عرض خيار التثبيت",!!installEvt||isStandalone(),
    isIOS()?"آيفون لا يدعم الخيار: Safari ← مشاركة ⬆️ ← إضافة إلى الشاشة الرئيسية"
    :"لو كل ما فوق ✓ حدّث الصفحة، استنى ٥ ثوانٍ، وتصفّح شاشتين قبل ما تعيد الفحص");
  S.diag={kind:'install',rows:R};render();
  const bad=R.filter(x=>!x.ok).length;
  toast(bad?`${bad} شرط ناقص للتثبيت`:"كل الشروط مستوفاة",bad?"err":"ok");
}
/* فحص التخزين قبل أي شيء: المتصفحات تمنع IndexedDB عند فتح الملف مباشرة (file://)
   فتفشل الكتابة بصمت ويظن المستخدم أن الإضافة لا تعمل. نقولها صراحة. */
async function storageProbe(){
  if(!globalThis.indexedDB)throw new Error("IndexedDB غير متاح");
  await openDB();
  const probe={type:'void',voidOf:'__probe__',date:todayISO(),id:'__probe__'};
  const tx=DBH.transaction('meta','readwrite');
  await rq(tx.objectStore('meta').put({k:'__probe__',v:Date.now()}));
}
(async function boot(){
  try{
    await storageProbe();
    /* اختصارات الضغط المطوّل على أيقونة التطبيق */
    const g=new URLSearchParams(location.search).get('go');
    const GO={invoice:['fin',{fin:'invoice'}],collect:['fin',{fin:'collect'}],
      box:['ops',{ops:'box',box:'out'}],trip:['ops',{ops:'drv',drv:'trips'}],
      ice:['ops',{ops:'ice',ice:'op'}]}[g];
    if(GO){S.tab=GO[0];Object.assign(S.sub,GO[1]);history.replaceState({},'',location.pathname)}
    await refresh();
    navigator.storage?.persist?.().catch(()=>{});
  }catch(e){
    console.error(e);
    const local=location.protocol==='file:';
    $('#app').innerHTML=`<div class="errbox"><b>التخزين المحلي غير متاح</b>
      ${local?`أنت فاتح الملف مباشرة من الجهاز (<span class="num">file://</span>)، والمتصفحات بتمنع
      قاعدة البيانات في الحالة دي — فالبيانات ما بتتحفظش ولا بتظهر.<br><br>
      <b style="display:block;margin-top:8px">الحل:</b>
      ارفع الملفات على GitHub Pages أو أي استضافة، وافتح التطبيق من رابط
      <span class="num">https://</span> ثم ثبّته على الشاشة الرئيسية.`
      :`المتصفح رافض فتح قاعدة البيانات. جرّب الخروج من وضع التصفح الخاص، أو استخدم متصفحاً آخر.`}
      <br><br><span class="num" style="font-size:11px">${esc(e.message||'')}</span></div>`;
  }
})();
</script>
