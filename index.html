<title>دفتر السماكة — إدارة تجارة الأسماك</title>
<style>
/* ==========================================================================
   دفتر السماكة — النظام البصري

   المبادئ:
   ١. الخط أولاً. الخطوط الافتراضية للعربي على الهواتف (Geeza / Noto Naskh)
      رفيعة ومنخفضة التباين وتُقرأ بصعوبة في ضوء السوق. نستخدم
      IBM Plex Sans Arabic — مصمَّم أصلاً لواجهات البيانات، بأوزان حقيقية
      وعدّادات مفتوحة تميّز ب/ت/ث/ن عند المقاسات الصغيرة.
   ٢. لا تباعد حروف في العربي إطلاقاً. letter-spacing يفكّ الاتصال بصرياً
      ويجعل النص أصعب. المسافات للاتينية فقط.
   ٣. تدرّج رمادي واحد + لون أساسي واحد + زوج دلالي (مدين/دائن) فقط.
      هوية الأقسام بشريط رفيع لا بخلفية ملوّنة تأكل التباين.
   ٤. كل نص أساسي فوق ٧:١ تباين، والثانوي فوق ٤٫٨:١.
   ٥. الأرقام جدولية دائماً حتى تصطفّ الخانات رأسياً في الجداول.
   ========================================================================== */

/* ---------------- الرموز ---------------- */
:root{
  /* التدرّج المحايد — من حبر الميناء إلى ضباب الثلج */
  --ink:#0A1F2A;          /* النص الأساسي  16.1:1 */
  --ink-2:#24505E;        /* عناوين ثانوية  7.9:1 */
  --muted:#4C6A76;        /* نص ثانوي       5.6:1 */
  --faint:#8AA3AD;        /* تلميحات معطّلة */
  --line:#DBE5E9;
  --line-2:#BFD1D8;
  --bg:#F4F7F8;
  --card:#FFFFFF;
  --card-2:#EFF4F6;       /* رأس الجدول والتظليل */

  /* الأساسي */
  --primary:#0B6E75;
  --primary-ink:#05545A;
  --primary-bg:#E1EFF0;

  /* الزوج الدلالي */
  --debt:#A32130;   --debt-bg:#FBECEE;
  --credit:#186349; --credit-bg:#E6F2EC;
  --warn:#8A5A00;   --warn-bg:#FAF1DE;

  /* توافق مع الأسماء القديمة في الكود */
  --sea:var(--primary); --sea-soft:var(--primary-bg);
  --brass:var(--warn);  --brass-soft:var(--warn-bg);
  --paid:var(--credit); --paid-soft:var(--credit-bg);
  --debt-soft:var(--debt-bg); --mist:var(--bg); --ink-2x:var(--ink-2);

  --accent:var(--primary); --accent-soft:var(--primary-bg); --tint:var(--bg);
  --r:14px;
  --shadow:0 1px 2px rgba(10,31,42,.05), 0 10px 26px -20px rgba(10,31,42,.5);
  --dlgbg:rgba(10,31,42,.55);

  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;
  --num:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}

/* هوية الأقسام: الشريط والأيقونة فقط. الخلفية تلميح ٣٪ لا صبغة كاملة. */
body[data-theme=box]    {--accent:#9E2C36;--accent-soft:#FAEBEC;--tint:#FBF5F5}
body[data-theme=drivers]{--accent:#7E5200;--accent-soft:#FAF0DC;--tint:#FBF7F0}
body[data-theme=ice]    {--accent:#0A5C82;--accent-soft:#E2EFF6;--tint:#F2F7FA}

@media (prefers-color-scheme:dark){
  :root{
    --ink:#EAF1F3; --ink-2:#BCD2D9; --muted:#9AB4BD; --faint:#6D8892;
    --line:#22404B; --line-2:#2E5461; --bg:#0B1A21; --card:#12262F; --card-2:#183038;
    --primary:#4FB3BB; --primary-ink:#7ACBD1; --primary-bg:#0F3239;
    --debt:#F08A93;   --debt-bg:#3A1B20;
    --credit:#66C79B; --credit-bg:#12321F;
    --warn:#E0AE5B;   --warn-bg:#33270F;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
    --dlgbg:rgba(0,0,0,.68);
  }
  body[data-theme=box]    {--accent:#F08A93;--accent-soft:#3A1B20;--tint:#160F11}
  body[data-theme=drivers]{--accent:#E0AE5B;--accent-soft:#33270F;--tint:#15110A}
  body[data-theme=ice]    {--accent:#5EB3DC;--accent-soft:#10303F;--tint:#0A161C}
}

/* ---------------- الأساس ---------------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--tint);
  color:var(--ink);
  font-size:16px;
  line-height:1.65;          /* العربي يحتاج فسحة أكبر بين السطور */
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));
  transition:background .2s;
}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* الأرقام جدولية في كل مكان حتى تصطفّ الخانات */
.num,td.n,th.n,input[type=number],input[inputmode=decimal],input[inputmode=numeric]{
  font-family:var(--num);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
  direction:ltr;
}
.num{display:inline-block}
.flow{font-family:var(--font);direction:rtl;display:inline-block}

/* ---------------- الترويسة ---------------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--card);
  color:var(--ink);
  padding:calc(10px + env(safe-area-inset-top)) 16px 0;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;padding-bottom:11px}
.brand h1{margin:0;font-size:17px;font-weight:600;line-height:1.3}
.brand .mark{width:36px;height:36px;border-radius:10px;flex:0 0 auto;background:var(--accent);
  display:grid;place-items:center;font-size:17px;overflow:hidden;color:#fff}
.brand .mark.own{background:none}
.brand .mark img,.brand .mark svg{width:100%;height:100%;object-fit:cover;display:block}
#hsearch{margin-inline-start:auto;background:var(--card-2);border:1px solid var(--line);
  width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;color:var(--ink-2);
  display:grid;place-items:center;flex:0 0 auto}
.brand .today{margin-inline-start:12px;text-align:left;font-size:12px;color:var(--muted)}
.brand .today b{display:block;font-size:14px;color:var(--ink-2);font-weight:600;
  font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr}
.hdr-sub{margin-top:1px;font-size:12.5px;color:var(--muted);font-weight:400}
.band{height:3px;background:var(--accent);margin:0 -16px;border-radius:2px 2px 0 0}

/* ---------------- التخطيط ---------------- */
main{padding:16px 13px 8px;max-width:820px;margin:0 auto}
.sec-title{font-size:15px;font-weight:600;color:var(--ink);margin:26px 2px 10px;
  display:flex;align-items:center;gap:9px}
.sec-title span.n{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;font-size:12px;font-weight:600;font-family:var(--num)}
main>.sec-title:first-child{margin-top:4px}

.eyebrow{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);margin:24px 2px 10px;letter-spacing:0}
.eyebrow::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--accent);flex:0 0 auto}
.eyebrow.brass::before{background:var(--warn)}
.eyebrow.debt::before{background:var(--debt)}
.eyebrow .free{font-weight:400;color:var(--muted);font-size:13px}
main>.eyebrow:first-child{margin-top:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;gap:11px}.row>*{flex:1;min-width:0}
.note{font-size:13px;color:var(--muted);margin:11px 2px 0;line-height:1.6}

/* ---------------- بطاقات اللوحة ---------------- */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;box-shadow:var(--shadow);width:100%;text-align:right;position:relative;
  overflow:hidden;display:block;font-family:inherit;cursor:pointer;margin-bottom:11px;color:var(--ink)}
.tile::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--accent)}
.tile.debt::after{background:var(--debt)}
.tile.brass::after{background:var(--warn)}
.tile.paid::after{background:var(--credit)}
.tile.ice::after{background:#0A5C82}
.tile .lbl{font-size:13.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .lbl .car{margin-inline-start:auto;color:var(--faint);font-size:13px}
.tile .val{font-size:27px;font-weight:600;margin-top:3px;line-height:1.25;color:var(--ink);
  font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr}
.tile .val.sm{font-size:21px}
.tile .sub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.tile[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid2 .tile{margin-bottom:0}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--card-2);margin-top:11px}
.bar i{display:block;height:100%}

.drill{background:var(--card);border:1px solid var(--accent);border-top:0;
  border-radius:0 0 var(--r) var(--r);margin:-11px 0 12px;padding:2px 13px 4px}
.drow{display:flex;align-items:center;gap:9px;padding:13px 2px;border-bottom:1px solid var(--line);
  width:100%;background:none;border-inline:0;border-top:0;font-family:inherit;font-size:15px;
  text-align:right;cursor:pointer;color:var(--ink);min-height:50px}
.drow:last-child{border-bottom:0}
.drillsec{font-size:12.5px;font-weight:600;color:var(--muted);padding:10px 2px 4px;
  border-bottom:1px solid var(--line)}
.drow b{margin-inline-start:auto;font-family:var(--num);font-variant-numeric:tabular-nums;
  direction:ltr;font-size:16px;font-weight:600}
.drow .go{color:var(--faint);font-size:18px}

/* ---------------- الجداول ---------------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:right;font-size:12.5px;color:var(--muted);font-weight:600;
  padding:9px 8px;background:var(--card-2);white-space:nowrap;border-bottom:2px solid var(--line-2)}
th:first-child{border-start-start-radius:8px}
th:last-child{border-start-end-radius:8px}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--card-2) 45%,transparent)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:left}
td.n{font-size:15px;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;border-top:2px solid var(--line-2);background:var(--card-2);font-size:15px}
tfoot tr:nth-child(even) td{background:var(--card-2)}
.tname{font-weight:600}
.money-neg{color:var(--credit)}
.money-pos{color:var(--debt)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -3px;padding:0 3px}
.tscroll table{min-width:max-content}

.empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:14.5px;
  background:var(--card-2);border:1px dashed var(--line-2);border-radius:12px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-weight:600}

/* ---------------- النماذج ---------------- */
label{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin:0 0 6px 2px}
label .hint{font-weight:400;color:var(--muted);font-size:13px}
input,select,textarea,button{font-family:inherit;font-size:16.5px;letter-spacing:0}
input,select,textarea{width:100%;padding:13px 13px;border:1.5px solid var(--line-2);border-radius:11px;
  background:var(--card);color:var(--ink);appearance:none;min-height:50px}
input::placeholder{color:var(--faint)}
input[type=number],input[inputmode=decimal],input[inputmode=numeric],input[type=date]{text-align:right}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}
.field{margin-bottom:14px}
.field.locked input{background:var(--accent-soft);border-style:dashed;font-weight:600;color:var(--ink)}
.with-btn{display:flex;gap:9px}.with-btn input{flex:1}
.with-btn button{flex:0 0 auto;white-space:nowrap;padding-inline:14px}

button{cursor:pointer;border:0;border-radius:11px;font-weight:600;letter-spacing:0}
.btn{background:var(--accent);color:#fff;padding:14px 16px;width:100%;font-size:16px;min-height:52px}
.btn:active{transform:translateY(1px)}
.btn.brass{background:var(--warn)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line-2)}
.btn.wa{background:#0F7A6C}
.btn.dark{background:var(--ink)}
.btn.danger{background:var(--debt-bg);color:var(--debt);border:1.5px solid var(--debt)}
.btn.sm{padding:11px 14px;font-size:14px;width:auto;min-height:46px}
.btnrow{display:flex;gap:9px;margin-bottom:12px}.btnrow .btn{flex:1}

/* اختيار الجهات: أسماء ظاهرة بلمسة واحدة */
.pick{margin:0}
.pkrow{display:flex;flex-wrap:wrap;gap:8px}
.pchip{background:var(--card);border:1.5px solid var(--line-2);border-radius:22px;
  padding:11px 16px;font-size:15px;min-height:46px;color:var(--ink);font-family:inherit;
  cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.pchip.pksearch{background:var(--card-2);border-style:dashed;color:var(--ink-2);font-weight:600}
#pklist .drow{border-bottom:1px solid var(--line);gap:10px}
#pklist .drow .tname{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pklist .drow span:nth-child(2){margin-inline-start:auto}

.fent{display:flex;gap:8px;align-items:stretch}
.fent .btn{min-height:50px}

.rarebtn{width:100%;background:none;border:1px dashed var(--line-2);color:var(--muted);
  padding:10px;border-radius:10px;font-family:inherit;font-size:13.5px;margin-top:10px;cursor:pointer}

/* روابط ثانوية في الحسابات */
.finlinks{display:flex;gap:8px;margin:-4px 0 16px;overflow-x:auto;scrollbar-width:none}
.finlinks::-webkit-scrollbar{display:none}
.finlinks button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--muted);padding:8px 4px;font-family:inherit;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;min-height:40px}
.finlinks button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.finlinks button span{background:var(--card-2);color:var(--muted);font-size:12px;font-weight:600;
  padding:1px 7px;border-radius:20px;font-family:var(--num)}
.finlinks button span.warn{background:var(--debt-bg);color:var(--debt)}

/* بطاقات ورقة التسليم */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.hcell{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.hcell::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--line-2)}
.hcell.ok::after{background:var(--credit)}
.hcell.out::after{background:var(--debt)}
.hcell.in::after{background:var(--credit)}
.hcell.brass::after{background:var(--warn)}
.hcell .hl{font-size:12.5px;color:var(--muted);font-weight:500}
.hcell .hv{font-size:22px;font-weight:600;margin-top:2px;line-height:1.2}
.hcell .hs{font-size:12px;color:var(--muted);margin-top:2px}

/* اقتراحات الأعداد المتكرّرة */
.qn{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.qn button{background:var(--card-2);border:1.5px solid var(--line);border-radius:20px;
  padding:8px 16px;font-size:15px;font-family:var(--num);font-variant-numeric:tabular-nums;
  color:var(--ink-2);min-height:42px;cursor:pointer}
.qn button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}

/* تبويب فصل المجموعات فوق الاقتراحات */
.pkg{display:flex;gap:5px;background:var(--card-2);padding:4px;border-radius:11px;
  border:1px solid var(--line);margin-bottom:10px}
.pkg button{flex:1;background:none;border:0;padding:9px 10px;border-radius:8px;font-size:14px;
  color:var(--muted);font-family:inherit;min-height:42px;cursor:pointer}
.pkg button[aria-pressed=true]{background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(10,31,42,.12)}
.pchip.pkwh{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.pchip.pkwh[aria-pressed=true]{background:var(--accent);color:#fff}

/* نسبة المكتب كرقمين: ٤ / ٩٦ */
.ratio{display:flex;align-items:center;gap:10px}
.ratio input{flex:1;text-align:center;font-size:19px;font-weight:600;
  font-family:var(--num);font-variant-numeric:tabular-nums}
.ratio span{font-size:21px;color:var(--muted);font-weight:600}

/* أعمدة الداخل والخارج في التقارير */
.cin{color:var(--credit);font-weight:600}
.cout{color:var(--debt);font-weight:600}

/* ---------------- التبويبات ---------------- */
.seg{display:flex;gap:5px;background:var(--card-2);padding:5px;border-radius:13px;margin-bottom:16px;
  overflow-x:auto;scrollbar-width:none;border:1px solid var(--line)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;background:none;color:var(--muted);padding:11px 14px;font-size:14.5px;
  border-radius:9px;white-space:nowrap;min-height:46px}
.seg button[aria-selected=true]{background:var(--card);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(10,31,42,.14)}
.seg.inner{background:none;padding:0;gap:7px;border:0}
.seg.inner button{flex:0 0 auto;border:1.5px solid var(--line-2);background:var(--card);
  padding:9px 15px;font-size:14px;border-radius:22px;min-height:44px}
.seg.inner button[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.qr{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{flex:0 0 auto;background:var(--card);border:1.5px solid var(--line-2);color:var(--muted);
  padding:9px 14px;border-radius:22px;font-size:14px;min-height:44px}
.qr button[aria-selected=true]{background:var(--ink);color:var(--card);border-color:var(--ink);font-weight:600}
.qr.repsel{margin-bottom:14px}
.qr.repsel button{font-size:14.5px;padding:10px 16px}
.qr.repsel button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---------------- شريط الإيصال ---------------- */
.tape{background:var(--card);border:1.5px solid var(--warn);border-radius:6px;padding:18px 17px;
  margin-bottom:12px;position:relative}
.tape::before,.tape::after{content:"";position:absolute;inset-inline:-1px;height:9px;
  background:radial-gradient(circle at 5.5px -2px,var(--tint) 6.5px,#0000 7px) repeat-x;background-size:11px 9px}
.tape::before{top:-2px;transform:rotate(180deg)}
.tape::after{bottom:-2px}
.tape h3{margin:0 0 3px;font-size:16px;font-weight:600}
.tape .who{font-size:13.5px;color:var(--muted);margin-bottom:14px}
.tline{display:flex;align-items:baseline;gap:7px;padding:7px 0;font-size:15px}
.tline .k{color:var(--ink-2);white-space:nowrap}
.tline .dots{flex:1;border-bottom:1.5px dotted var(--line-2);transform:translateY(-4px)}
.tline .v{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;font-weight:600;white-space:nowrap}
.tline.minus .v{color:var(--debt)}
.tline.rule{border-top:1.5px solid var(--line-2);margin-top:7px;padding-top:11px}
.tline.total{margin-top:10px;padding:14px 14px;background:var(--ink);color:#fff;border-radius:10px}
.tline.total .k{color:#B9CFD6;font-weight:600}
.tline.total .dots{border-bottom-color:#3A5E6B}
.tline.total .v{font-size:21px;color:#fff}

/* ---------------- بطاقات الحركات (مضغوطة) ----------------
   العمليات قد تتجاوز ٥٠ في اليوم: سطر واحد لكل حركة، والتفاصيل بالضغط. */
.rec{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--card);overflow:hidden}
.rec.void{opacity:.55}
.rec.draft .rechead .dday{background:var(--brass-soft);color:var(--warn);font-weight:600;
  padding:3px 9px;border-radius:8px;font-size:13px;flex:0 0 auto}
.rec.open{border-color:var(--accent)}
.rechead{display:flex;flex-direction:column;gap:3px;width:100%;background:none;border:0;
  padding:11px 13px;font-family:inherit;text-align:right;cursor:pointer;color:var(--ink)}
.rec.open .rechead{background:var(--card-2)}
.rechead .r1,.rechead .r2{display:flex;align-items:center;gap:8px;width:100%}
.rechead .r1 b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rechead .rv{margin-inline-start:auto;font-size:16px;font-weight:600;flex:0 0 auto;
  font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.rechead .rm{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;flex:1 1 auto;min-width:0}
.rechead .rd{font-size:12.5px;color:var(--faint);flex:0 0 auto;direction:ltr;
  font-variant-numeric:tabular-nums}
.rechead .tag{flex:0 0 auto}
.recbody{padding:10px 12px 12px;border-top:1px solid var(--line)}
.rec .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 12px 3px}
.rec .top b{font-size:15px;font-weight:600}
.rec .top .date{margin-inline-start:auto;font-size:12.5px;color:var(--muted);
  font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr}
.rec .top+.meta{padding:0 12px}
.rec .top~.acts{padding:0 12px 12px;margin-top:9px}
.rec .meta{font-size:13.5px;color:var(--muted);line-height:1.6}
.rec .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent)}
.tag.void{background:var(--debt-bg);color:var(--debt)}
.tag.brass{background:var(--warn-bg);color:var(--warn)}
.tag.dmg{background:var(--debt-bg);color:var(--debt)}
.tag.edit{background:var(--card-2);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:14px;padding:9px 14px;border-radius:22px;background:var(--card-2);
  border:1px solid var(--line);display:flex;align-items:center;gap:7px;min-height:44px}
.chip .n{font-family:var(--num);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13.5px;direction:ltr}
.more{width:100%;background:var(--card);border:1.5px dashed var(--line-2);color:var(--ink-2);
  padding:14px;border-radius:12px;margin-bottom:12px;font-size:14.5px;min-height:50px}

.diff{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;
  border-radius:11px;background:var(--card-2);margin-bottom:9px;font-size:14.5px;color:var(--ink)}
.diff b{font-family:var(--num);font-variant-numeric:tabular-nums;direction:ltr;font-size:16px;white-space:nowrap}
.diff.short{background:var(--debt-bg);color:var(--debt)}
.diff.over{background:var(--credit-bg);color:var(--credit)}

/* ---------------- التنقّل ---------------- */
nav{position:fixed;inset-inline:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line-2);display:flex;padding:5px 2px calc(5px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;padding:7px 1px;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11.5px;font-weight:500;min-height:52px}
nav button .ic{font-size:21px;line-height:1;filter:grayscale(1);opacity:.55}
nav button[aria-selected=true]{color:var(--accent);font-weight:600}
nav button[aria-selected=true] .ic{filter:none;opacity:1}

/* ---------------- التنبيهات والحوارات ---------------- */
/* زر التسجيل الطافي: خيارات تطلع فوقه بدل شاشة كاملة —
   الوصول لأي قسم بلمستين من أي مكان في التطبيق. */
#fabwrap{position:fixed;inset:0;z-index:60;pointer-events:none}
#fabwrap.hide{display:none}
#fabbd{position:absolute;inset:0;background:rgba(10,31,42,.35);opacity:0;visibility:hidden;
  transition:opacity .18s;pointer-events:none}
#fabwrap.on #fabbd{opacity:1;visibility:visible;pointer-events:auto}
#fab{position:absolute;inset-inline-end:16px;bottom:calc(92px + env(safe-area-inset-bottom));
  width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;border:0;
  box-shadow:0 10px 26px -8px rgba(10,31,42,.55);display:grid;place-items:center;cursor:pointer;
  pointer-events:auto;transition:transform .2s}
#fab span{font-size:34px;line-height:1;font-weight:300;margin-top:-3px}
#fab:active{transform:scale(.93)}
#fabwrap.on #fab{transform:rotate(45deg)}
#fabmenu{position:absolute;inset-inline-end:18px;
  bottom:calc(162px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
  align-items:flex-end;gap:11px;pointer-events:none}
#fabmenu button{display:flex;align-items:center;gap:11px;background:var(--card);color:var(--ink);
  border:1.5px solid var(--line-2);border-radius:30px;padding:9px 10px 9px 18px;font-family:inherit;
  font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px -8px rgba(10,31,42,.5);
  opacity:0;transform:translateY(14px) scale(.9);transition:opacity .16s,transform .16s;
  pointer-events:none;min-height:50px;white-space:nowrap}
#fabwrap.on #fabmenu button{opacity:1;transform:none;pointer-events:auto}
#fabwrap.on #fabmenu button:nth-child(1){transition-delay:.10s}
#fabwrap.on #fabmenu button:nth-child(2){transition-delay:.07s}
#fabwrap.on #fabmenu button:nth-child(3){transition-delay:.04s}
#fabwrap.on #fabmenu button:nth-child(4){transition-delay:.01s}
#fabmenu button i{font-style:normal;font-size:20px;width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;flex:0 0 auto}
#fabmenu .f-acct i{background:var(--primary-bg)}
#fabmenu .f-box  i{background:#FAEBEC}
#fabmenu .f-drv  i{background:#FAF0DC}
#fabmenu .f-ice  i{background:#E2EFF6}
@media (prefers-color-scheme:dark){
  #fabmenu .f-box i{background:#3A1B20}
  #fabmenu .f-drv i{background:#33270F}
  #fabmenu .f-ice i{background:#10303F}
}

#toast{position:fixed;inset-inline:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:95;
  display:flex;flex-direction:column;gap:9px;pointer-events:none;align-items:center}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:24px;font-size:14.5px;
  font-weight:500;box-shadow:0 14px 34px -12px rgba(10,31,42,.65);animation:pop .22s ease;max-width:100%}
.toast.err{background:var(--debt)}
.toast.ok{background:var(--credit)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}

#modal,#dlg{position:fixed;inset:0;z-index:99;background:var(--dlgbg);display:none;
  align-items:flex-end;justify-content:center}
#dlg{z-index:120;align-items:center;padding:18px}
#modal.on,#dlg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:580px;border-radius:20px 20px 0 0;
  padding:18px 17px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .2s ease}
#dlg .sheet{border-radius:18px;max-width:440px;padding:20px}
@keyframes up{from{transform:translateY(26px)}}
.sheet h3{margin:0 0 5px;font-size:18px;font-weight:600}
.sheet .sub{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.65}

.errbox{border:1.5px solid var(--debt);background:var(--debt-bg);border-radius:14px;padding:17px;color:var(--debt);font-size:15px;line-height:1.7}
.errbox b{display:block;margin-bottom:7px;font-size:16.5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:640px){
  main{padding:20px 18px 8px}
  .grid2{grid-template-columns:1fr 1fr}
  table{font-size:15px}
}

/* ==========================================================================
   الطباعة — تصميم التقارير الورقية
   ورق أبيض، حبر أسود، بلا ظلال ولا ألوان خلفية إلا التظليل الخفيف للصفوف.
   رأس الجدول يتكرر تلقائياً على كل صفحة، والمجاميع لا تنفصل عن جدولها.
   ========================================================================== */
#print{display:none}
@media print{
  header,nav,#toast,#modal,#dlg,main{display:none!important}
  html,body{background:#fff!important;color:#000!important;font-size:11pt;line-height:1.55}
  #print{display:block!important;padding:0;color:#000}

  .prt-head{display:flex;align-items:flex-start;gap:14px;padding-bottom:10px;
    border-bottom:2.5pt solid #000;margin-bottom:16px}
  .prt-head img{width:52px;height:52px;object-fit:contain}
  .prt-head h2{margin:0;font-size:16pt;font-weight:700;line-height:1.3}
  .prt-head p{margin:3px 0 0;font-size:11.5pt;font-weight:600}
  .prt-head .meta{margin-inline-start:auto;text-align:left;font-size:9pt;color:#333;line-height:1.6;white-space:nowrap}

  #print h3{font-size:12pt;margin:18px 0 7px;padding-bottom:4px;border-bottom:1pt solid #666;
    page-break-after:avoid;break-after:avoid}
  #print table{width:100%;border-collapse:collapse;font-size:9.5pt;margin-bottom:10px}
  #print thead{display:table-header-group}       /* رأس الجدول يتكرر على كل صفحة */
  #print tfoot{display:table-footer-group}
  #print tr{page-break-inside:avoid;break-inside:avoid}
  #print th{background:#E8E8E8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;
    border:0.6pt solid #555;padding:6px 7px;text-align:right;font-weight:700;font-size:9pt}
  #print td{border:0.6pt solid #999;padding:5px 7px;text-align:right}
  #print tbody tr:nth-child(even) td{background:#F6F6F6!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print td:last-child,#print th:last-child,
  #print td.n,#print th.n{text-align:left;font-variant-numeric:tabular-nums}
  #print tfoot td{font-weight:700;border-top:1.6pt solid #000;background:#EDEDED!important;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .prt-sign{margin-top:26px;display:flex;gap:40px;page-break-inside:avoid}
  .prt-sign div{flex:1;border-top:1pt solid #000;padding-top:6px;font-size:9.5pt;text-align:center}
  .prt-foot{margin-top:20px;border-top:1pt solid #999;padding-top:6px;font-size:8.5pt;color:#444;
    display:flex;justify-content:space-between}
  @page{margin:14mm 12mm}
}

</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" id="hdrLogo">🐟</div>
    <div><h1 id="hdrName">دفتر السماكة</h1><div class="hdr-sub" id="hdrSub">—</div></div>
    <button id="hsearch" data-act="openSearch" aria-label="بحث">🔎</button>
    <div class="today"><span>اليوم</span><b id="hdrDate">—</b></div>
  </div>
  <div class="band"></div>
</header>
<main id="app"><div class="empty">جارٍ تحضير الدفتر…</div></main>
<nav id="nav">
  <button data-tab="home" aria-selected="true"><span class="ic">🏠</span>الرئيسية</button>
  <button data-tab="fin"><span class="ic">🧾</span>الحسابات</button>
  <button data-tab="ops"><span class="ic">📦</span>العمليات</button>
  <button data-tab="rep"><span class="ic">📈</span>التقارير</button>
  <button data-tab="set"><span class="ic">⚙️</span>الإعدادات</button>
</nav>
<div id="fabwrap">
  <div id="fabbd" data-act="fabClose"></div>
  <div id="fabmenu">
    <button data-act="fabGo" data-go="fin|fin|invoice" class="f-acct"><span>حسابات</span><i>🧾</i></button>
    <button data-act="fabGo" data-go="ops|ops|box"     class="f-box"><span>بكش</span><i>📦</i></button>
    <button data-act="fabGo" data-go="ops|ops|drv"     class="f-drv"><span>سائقين</span><i>🚚</i></button>
    <button data-act="fabGo" data-go="ops|ops|ice"     class="f-ice"><span>ثلج</span><i>🧊</i></button>
  </div>
  <button id="fab" data-act="fabToggle" aria-label="تسجيل عملية" aria-expanded="false"><span>+</span></button>
</div>
<div id="toast"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="dlg" role="dialog" aria-modal="true"></div>
<div id="print"></div>

<script>
"use strict";
/* ==========================================================================
   دفتر السماكة — سجل تراكمي (Append-only) مع تعديل وحذف آمنين

   التعديل والحذف مطلوبان للمستخدم، والتلاعب ممنوع. الحل:
   • الحذف  = إضافة شاهدة إلغاء {type:'void', voidOf:<id>} — الأصل يبقى بالسجل.
   • التعديل = إضافة نسخة جديدة تحمل replaces:<id> — القديمة تُعلَّم «مستبدلة».
   لا يُمسح سطر ولا يُكتب فوقه أبداً؛ الحسابات تقرأ الحركات الحيّة فقط.
   ========================================================================== */

/* ============ أدوات ============ */
/* شعار التطبيق الافتراضي — نفس أيقونة التثبيت */
const BRANDMARK=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
<rect width="512" height="512" rx="115" fill="#0F7B76"/>
<rect x="146" y="112" width="220" height="288" rx="16" fill="#fff"/>
<rect x="216" y="80" width="80" height="48" rx="12" fill="#A97B22"/>
<rect x="236" y="64" width="40" height="24" rx="8" fill="#fff" opacity=".9"/>
<line x1="186" y1="170" x2="326" y2="170" stroke="#0F7B76" stroke-width="12" stroke-linecap="round" opacity=".3"/>
<line x1="186" y1="210" x2="276" y2="210" stroke="#0F7B76" stroke-width="12" stroke-linecap="round" opacity=".3"/>
<polygon points="190,320 140,290 140,350" fill="#0F7B76"/>
<path d="M 190 320 Q 260 260 330 320 Q 260 380 190 320 Z" fill="#0F7B76"/>
<circle cx="295" cy="315" r="6" fill="#A97B22"/></svg>`;
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const money=n=>nf.format(Math.round((+n||0)*100)/100);
const EGP=n=>money(n)+" ج.م";
/* المبالغ في الجداول: صنف لوني ثابت — الأحمر «عليه» والأخضر «له» — ولا نعتمد
   على اللون وحده، فالرقم السالب يظل مسبوقاً بإشارته. */
const mcell=(v,flip)=>{const n=+v||0;const cls=Math.abs(n)<.005?'':((flip?-n:n)>0?'money-pos':'money-neg');
  return `<td class="n ${cls}">${money(n)}</td>`};
const todayISO=()=>new Date().toLocaleDateString('en-CA');
const arDate=iso=>{if(!iso)return"—";const[y,m,d]=iso.split('-');return `${d}/${m}/${y}`};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
/* حساب المال بالقروش الصحيحة: 0.1+0.2 بالعشري = 0.30000000000000004،
   ومع آلاف السطور الفرق يظهر في المجاميع. نجمع صحيحاً ثم نقسم. */
const P=v=>Math.round((+v||0)*100);
const fromP=p=>p/100;
const sumM=(a,f)=>a.reduce((t,x)=>t+P(f(x)),0)/100;
const msum=(...v)=>v.reduce((t,x)=>t+P(x),0)/100;   // جمع بإشارات: msum(a,-b,-c)
/* سلسلة تجزئة تكشف أي عبث مباشر بقاعدة البيانات */
const _enc=new TextEncoder();
async function sha(s){
  if(globalThis.crypto?.subtle){
    const b=await crypto.subtle.digest('SHA-256',_enc.encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,32)}
  let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}
  return "fnv"+h.toString(16).padStart(8,'0');
}
/* تمثيل ثابت للحركة (ترتيب مفاتيح مؤكَّد) حتى تتطابق التجزئة عند إعادة الفحص */
const bodyOf=r=>JSON.stringify(Object.keys(r).filter(k=>!['seq','hash','prevHash'].includes(k)).sort().map(k=>[k,r[k]]));
const addDays=(iso,d)=>{const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()+d);return t.toLocaleDateString('en-CA')};
const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toLocaleDateString('en-CA')};
/* حوارات داخل التطبيق: confirm/prompt الأصلية تُحجب في وضع PWA المثبَّت،
   وشكلها لاتيني الاتجاه، و prompt تعرض الرقم السري مكشوفاً. */
function dialog({title,text,ok="تأكيد",cancel="إلغاء",input,danger}){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<div class="sheet"><h3>${esc(title)}</h3>
      ${text?`<p class="sub" style="white-space:pre-line">${esc(text)}</p>`:''}
      ${input?`<div class="field"><input id="dlgIn" type="${input.type||'text'}"
        inputmode="${input.mode||'text'}" placeholder="${esc(input.placeholder||'')}" value="${esc(input.value||'')}"></div>`:''}
      <div class="btnrow" style="margin:0">
        <button class="btn ghost" data-r="0">${esc(cancel)}</button>
        <button class="btn ${danger?'danger':''}" data-r="1">${esc(ok)}</button></div></div>`;
    d.classList.add('on');
    const inp=$('#dlgIn',d);if(inp)setTimeout(()=>inp.focus(),60);
    const done=v=>{d.classList.remove('on');d.innerHTML='';d.onclick=null;d.onkeydown=null;res(v)};
    d.onclick=ev=>{
      if(ev.target===d)return done(input?null:false);
      const b=ev.target.closest('[data-r]');if(!b)return;
      done(b.dataset.r==='0'?(input?null:false):(input?(inp?inp.value:''):true));
    };
    d.onkeydown=ev=>{if(ev.key==='Escape')done(input?null:false);
      if(ev.key==='Enter'&&inp)done(inp.value)};
  });
}
const ask=(title,text,o={})=>dialog({title,text,...o});
const askPin=(title)=>dialog({title,input:{type:'password',mode:'numeric',placeholder:'••••'},ok:"دخول"});
function toast(m,k=""){const t=document.createElement('div');t.className='toast '+k;t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2800)}

const DBN="fish_trade_ledger",DBV=2;let DBH=null;
function openDB(){return new Promise((res,rej)=>{
  const rq=indexedDB.open(DBN,DBV);
  rq.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('ledger')){const s=db.createObjectStore('ledger',{keyPath:'seq',autoIncrement:true});s.createIndex('type','type');s.createIndex('date','date')}
    if(!db.objectStoreNames.contains('entities'))db.createObjectStore('entities',{keyPath:'id'}).createIndex('type','type');
    if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'k'})};
  rq.onsuccess=()=>{DBH=rq.result;res()};rq.onerror=()=>rej(rq.error)})}
const st=(n,m)=>DBH.transaction(n,m).objectStore(n);
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const getAll=n=>rq(st(n,'readonly').getAll());
/* ---- طبقة تحقق واحدة: لا حركة ناقصة أو مشوَّهة تدخل السجل مهما كان مصدرها ---- */
const SCHEMA={invoice:['date','farmId','merchantId'],collection:['date','merchantId'],
  trip:['date','driverId'],driver_advance:['date','driverId'],driver_payment:['date','driverId'],
  factory_payment:['date','factoryId'],ice_op:['date','factoryId','farmId'],
  settlement:['date','farmId'],settlement_reversal:['refId'],box:['date','op'],void:['voidOf'],
  opening_cash:['date','entityId','amount'],
  driver_damage_clear:['date','driverId','count']};
/* الفاتورة غير مذكورة هنا عمداً: مبلغها قد يكون صفراً (مسوّدة) */
const POSF={collection:['amount'],driver_advance:['amount'],
  driver_payment:['amount'],factory_payment:['amount'],ice_op:['qty']};
function validate(e){
  if(!e||!e.type)throw new Error("نوع الحركة مفقود");
  const req=SCHEMA[e.type];if(!req)throw new Error("نوع حركة غير معروف: "+e.type);
  for(const k of req)if(e[k]===undefined||e[k]===null||e[k]==="")throw new Error("حقل ناقص: "+k);
  if(e.date&&!/^\d{4}-\d{2}-\d{2}$/.test(e.date))throw new Error("تاريخ غير صالح");
  for(const k of(POSF[e.type]||[]))if(!(+e[k]>0))throw new Error("قيمة غير صالحة: "+k);
  if(e.type==='box'&&!(e.legs||[]).length)throw new Error("حركة بكش بلا حركة فعلية");
}
/* قفل الفترات: لا كتابة ولا تعديل داخل فترة مقفولة إلا بصلاحية الأونر */
function guardLock(date){
  const L=S.sec.lockedUntil;
  if(!L||!date||date>L||S.session)return;
  throw new Error(`الفترة حتى ${arDate(L)} مقفولة — تحتاج صلاحية الأونر`);
}
async function append(e){
  validate(e);guardLock(e.date);
  if(e.note)e.note=clean(e.note);
  const rec={...e,id:e.id||uid(),opId:e.opId||uid(),dev:S.devId,
    by:S.session?'owner':'staff',createdAt:new Date().toISOString()};
  rec.prevHash=S.chainTip||"";
  rec.hash=await sha(rec.prevHash+bodyOf(rec));
  rec.seq=await rq(st('ledger','readwrite').add(rec));
  /* تحديث تراكمي في الذاكرة بدل إعادة قراءة السجل كاملاً من القرص عند كل كتابة */
  S.ledger.push(rec);S.chainTip=rec.hash;
  S.D=derive(S.entities,S.ledger);render();backupNudge();
  return rec}

const BOXF={

  opening_box:[['locId','الموقع','ent','loc'],['oIntact','بكش سليم','num',null,1],['oDamaged','بكش تالف','num',null,1]]

function buildLegs(op,p){
  const n=k=>Math.max(0,Math.round(+p[k]||0)),v=k=>p[k]||"";
  const L={
    issue_farm:()=>[[WH,v('toId'),'intact',n('count')]],
    scrap_out:()=>[[WH,'#RECYCLE','damaged',n('count')]],
    /* قاعدة النموذج: عهدة الجهات «سليم» فقط، والتالف لا يوجد إلا في المخزن.
       الصندوق خرج للجهة سليماً، فيُخصم من عهدتها سليماً حتى لو رجع تالفاً،
       ويدخل المخزن تالفاً. تحويل الحالة يمرّ عبر عقدة التصحيح #ADJ. */
    return_in:()=>[[v('fromId'),WH,'intact',n('okCount')||n('count')],
                   [v('fromId'),'#ADJ','intact',n('dmgCount')],
                   ['#ADJ',WH,'damaged',n('dmgCount')]],
    factory_replace:()=>[[WH,'#SUPPLY','damaged',n('damagedOut')],['#SUPPLY',WH,'intact',n('intactIn')]],
    purchase_in:()=>[['#PURCHASE',WH,'intact',n('count')]],
    sale_move:()=>[[v('farmId'),v('merchantId'),'intact',n('count')]],
    empty_back:()=>[[v('merchantId'),v('farmId'),'intact',n('count')]],
    farm_swap:()=>[[v('fromId'),v('toId'),'intact',n('count')]],
    /* تصحيح الحالة في المخزن وحده — لا وجود لتالف خارجه */
    fix_d2i:()=>[[WH,'#ADJ','damaged',n('count')],['#ADJ',WH,'intact',n('count')]],
    fix_i2d:()=>[[WH,'#ADJ','intact',n('count')],['#ADJ',WH,'damaged',n('count')]],
    /* خارج المخزن الحالة سليم إجباراً */
    out_noone:()=>[[v('locId'),'#LOSS',v('locId')===WH?(v('cond')||'intact'):'intact',n('count')]],
    in_nosource:()=>[['#EXT',v('locId'),v('locId')===WH?(v('cond')||'intact'):'intact',n('count')]],
    opening_box:()=>[['#OPEN',v('locId'),'intact',n('oIntact')],
                     ['#OPEN',v('locId'),'damaged',v('locId')===WH?n('oDamaged'):0]]
  }[op];
  return (L?L():[]).map(([f,t,c,ct])=>({from:f,to:t,cond:c,count:ct})).filter(l=>l.count>0);
}
function legsOf(e){
  if(e.type==='box')return (e.legs||[]).filter(l=>+l.count>0);
  if(e.type==='box_out')return[{from:WH,to:e.entityId,cond:'intact',count:+e.count||0}];
  if(e.type==='box_in')return[{from:e.entityId,to:WH,cond:'intact',count:+e.count||0}];
  if(e.type==='box_replace')return[{from:e.entityId,to:WH,cond:'damaged',count:+e.damagedIn||0},{from:WH,to:e.entityId,cond:'intact',count:+e.intactOut||0}].filter(l=>l.count>0);
  if(e.type==='box_move')return[{from:e.fromId,to:e.toId,cond:'intact',count:+e.count||0}];
  return[];
}

const S={tab:"home",
  sub:{fin:"invoice",ops:"box",box:"out",boxop:"issue_farm",drv:"trips",ice:"op",
    rep:"box",repbox:"stmt",set:"farm",setg:"data",acct:"all",dacct:"driver"},
  rep:"hand",
  drill:{},entities:[],ledger:[],co:{name:"دفتر السماكة",phone:"",logo:""},autoBox:true,
  devId:"",chainTip:"",session:false,sec:{pin:"",lockedUntil:""},bk:{last:"",auto:true,every:50},

function derive(entities,ledger){
  /* الحركات الميتة: ملغاة أو مستبدلة بنسخة أحدث */
  const dead=new Set();
  ledger.forEach(e=>{if(e.voidOf)dead.add(e.voidOf);if(e.replaces)dead.add(e.replaces)});
  const live=ledger.filter(e=>e.type!=='void'&&!dead.has(e.id));
  const T=t=>live.filter(e=>e.type===t);
  /* الفاتورة بلا مبلغ = مسوّدة: تُحفظ لئلا تُنسى، وتنقل البكش فعلاً،
     لكنها لا تدخل أي حساب مالي حتى يُكتب مبلغها. */
  const allInv=T('invoice');
  const drafts=allInv.filter(i=>!(+i.amount>0));
  const invoices=allInv.filter(i=>+i.amount>0);
  const collections=T('collection'),settlements=T('settlement');
  const voided=new Set(T('settlement_reversal').map(e=>e.refId));
  const actSet=settlements.filter(s=>!voided.has(s.id));
  const covered=new Set();actSet.forEach(s=>(s.coveredIds||[]).forEach(i=>covered.add(i)));
  const ent=id=>entities.find(e=>e.id===id);
  const list=t=>entities.filter(e=>e.type===t&&!e.deleted).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const nameOf=id=>id===WH?'المخزن':(VIRT[id]||ent(id)?.name||"«محذوف»");
  const phoneOf=id=>ent(id)?.phone||"";

  /* الأرصدة الافتتاحية حركات مؤرَّخة في السجل، لا خانات في بطاقة الجهة —
     فتبقى قابلة للمراجعة والتعديل بحركة، ولا تُكتب فوقها يدوياً. */
  const opens=T('opening_cash');
  const openOf=id=>sumM(opens.filter(o=>o.entityId===id),o=>o.amount);
  const merchants=list('merchant').map(m=>{
    const inv=invoices.filter(i=>i.merchantId===m.id),col=collections.filter(c=>c.merchantId===m.id);
    return{...m,invoiced:sumM(inv,i=>i.amount),collected:sumM(col,c=>c.amount),opening:openOf(m.id),
      balance:msum(openOf(m.id),sumM(inv,i=>i.amount),-sumM(col,c=>c.amount)),invCount:inv.length}});
  const farms=list('farm').map(f=>{
    const inv=invoices.filter(i=>i.farmId===f.id),cyc=inv.filter(i=>!covered.has(i.id));
    const ss=actSet.filter(s=>s.farmId===f.id);
    return{...f,cycleInvoices:cyc,cycleCount:cyc.length,cycleBoxes:sum(cyc,i=>i.boxes),
      cycleTotal:sumM(cyc,i=>i.amount),opening:openOf(f.id),
      balance:msum(openOf(f.id),sumM(inv,i=>i.amount),-sumM(ss,s=>s.total)),settlements:ss}});

  /* تالف السائقين: عدّاد متابعة فقط — ليس مالاً ولا عهدة.
     الصناديق نفسها تدخل حساب المخزن كالمعتاد. */
  const dmgClear=T('driver_damage_clear');
  const dmgOf=id=>{
    let neg=0,wear=0;
    T('box').filter(e=>e.op==='return_in'&&e.driverId===id).forEach(e=>{
      const d=sum(legsOf(e).filter(l=>l.cond==='damaged'),l=>l.count);
      if(e.dmgReason==='negligence')neg+=d;else wear+=d});
    const cleared=sum(dmgClear.filter(c=>c.driverId===id),c=>c.count);
    return{neg,wear,cleared,open:neg-cleared}};
  const trips=T('trip'),adv=T('driver_advance'),dpay=T('driver_payment');
  const drivers=list('driver').map(d=>{
    const t=trips.filter(x=>x.driverId===d.id),a=adv.filter(x=>x.driverId===d.id),p=dpay.filter(x=>x.driverId===d.id);
    return{...d,dmg:dmgOf(d.id),
      tripsCount:t.length,tripsCost:sumM(t,x=>x.fare??x.cost),advances:sumM(a,x=>x.amount),
      paid:sumM(p,x=>x.amount),opening:openOf(d.id),
      balance:msum(openOf(d.id),sumM(t,x=>x.fare??x.cost),-sumM(a,x=>x.amount),-sumM(p,x=>x.amount))}});

  const iceOps=T('ice_op').concat(T('ice_in').map(e=>({...e,type:'ice_op',qty:e.qty,unitPrice:e.unitPrice||0})));
  const fpay=T('factory_payment');
  const boxE=T('box');
  /* مصنع الثلج حساب نقدي بحت: بلاطات × سعر − مدفوع. لا بكش ولا عهدة. */
  const factories=list('ice').map(f=>{
    const o=iceOps.filter(x=>x.factoryId===f.id),p=fpay.filter(x=>x.factoryId===f.id);
    const value=sumM(o,x=>(+x.qty||0)*(+x.unitPrice||0));
    return{...f,blocks:sum(o,x=>x.qty),value,paid:sumM(p,x=>x.amount),opening:openOf(f.id),
      balance:msum(openOf(f.id),value,-sumM(p,x=>x.amount))}});
  const repCost=sumM(boxE.filter(b=>b.op==='factory_replace'),b=>b.cost);

  /* دفتر البكش */
  const bal={},loss={};const tc=k=>bal[k]=bal[k]||{intact:0,damaged:0};
  live.forEach(e=>legsOf(e).forEach(l=>{const c=+l.count||0;if(!c||!l.from||!l.to)return;
    tc(l.from);tc(l.to);bal[l.from][l.cond]-=c;bal[l.to][l.cond]+=c;
    if(l.to==='#LOSS')loss[l.from]=(loss[l.from]||0)+c;
    if(l.from==='#LOSS')loss[l.to]=(loss[l.to]||0)-c}));
  const boxOf=id=>{const b=bal[id]||{intact:0,damaged:0};return{intact:b.intact,damaged:b.damaged,total:b.intact+b.damaged,loss:loss[id]||0}};
  const mBox=merchants.map(m=>({...m,box:boxOf(m.id)})),fBox=farms.map(f=>({...f,box:boxOf(f.id)}));
  const wh=boxOf(WH);
  const custody={merchants:sum(mBox,m=>m.box.total),farms:sum(fBox,f=>f.box.total)};
  custody.all=wh.total+custody.merchants+custody.farms;

  const linked=new Set(boxE.filter(e=>e.op==='sale_move'&&e.invoiceId).map(e=>e.invoiceId));
  /* آخر استخدام لكل جهة — الأكثر استعمالاً يظهر أولاً فيقلّ البحث */
  const lastUse={};
  const KEYS=['farmId','merchantId','driverId','factoryId','entityId','locId','routeId','fromId','toId','supId'];
  live.forEach(e=>{
    KEYS.forEach(k=>{if(e[k])lastUse[e[k]]=Math.max(lastUse[e[k]]||0,e.seq||0)});
    if(e.params)KEYS.forEach(k=>{if(e.params[k])lastUse[e.params[k]]=Math.max(lastUse[e.params[k]]||0,e.seq||0)});
  });
  const byRecent=arr=>[...arr].sort((a,b)=>(lastUse[b.id]||0)-(lastUse[a.id]||0)||a.name.localeCompare(b.name,'ar'));
  const t=todayISO();
  return{live,dead,invoices,collections,settlements,actSet,voided,covered,lastUse,byRecent,
    merchants,farms,drivers,factories,mBox,fBox,boxOf,wh,custody,repCost,nameOf,phoneOf,ent,
    trips,adv,dpay,iceOps,fpay,boxE,
    openOf,opens,drafts,allInv,dmgOf,dmgClear,
    recent:(()=>{const R={};const take=(k,f)=>{const o=[];
      for(let i=live.length-1;i>=0&&o.length<8;i--){const v=f(live[i]);if(v&&!o.includes(v))o.push(v)}
      R[k]=o};
      take('farm',e=>e.farmId||(e.params&&(e.params.farmId||e.params.toId)));
      take('merchant',e=>e.merchantId);
      take('driver',e=>e.driverId);
      take('ice',e=>e.factoryId);
      take('route',e=>e.routeId);
      R.loc=['WH'].concat(R.farm,R.merchant).slice(0,8);
      R.farmerchant=R.farm.concat(R.merchant).slice(0,8);
      return R})(),
    /* أكثر أعداد الصناديق تكراراً في الفواتير */
    /* ثلاثة اقتراحات: ٧٠ و٨٤ دائماً، والثالث أكثر عدد استُخدم بعدهما */
    boxTop:(()=>{const c={};allInv.forEach(i=>{const n=Math.round(+i.boxes||0);if(n>0)c[n]=(c[n]||0)+1});
      const used=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(x=>+x[0]);
      const third=used.find(v=>!NUMSEED.includes(v));
      return [...NUMSEED,third===undefined?100:third]})(),
    unlinked:invoices.filter(i=>(+i.boxes||0)>0&&!linked.has(i.id)),
    routes:list('route'),activeFarms:farms.filter(f=>f.cycleCount>0),
    locOptions:[{id:WH,name:'المخزن'},...farms,...merchants],
    kpi:{merchantDebt:sumM(merchants,m=>Math.max(m.balance,0)),merchantCredit:sumM(merchants,m=>Math.min(m.balance,0)),
      farmDue:sumM(farms,f=>f.balance),driverDue:sumM(drivers,d=>Math.max(d.balance,0)),
      iceDue:sumM(factories,f=>Math.max(f.balance,0)),iceBlocks:sum(factories,f=>f.blocks),
      todaySales:sumM(live.filter(e=>e.type==='invoice'&&e.date===t),e=>e.amount),
      todayCollected:sumM(live.filter(e=>e.type==='collection'&&e.date===t),e=>e.amount)},
    todays:live.filter(e=>e.date===t)}}

async function refresh(){
  S.entities=await getAll('entities');S.ledger=await getAll('ledger');
  S.co=(await getMeta('company'))||S.co;
  S.autoBox=(await getMeta('autoBox'))??true;
  S.sec=(await getMeta('security'))||S.sec;
  S.bk=(await getMeta('backup'))||S.bk;
  S.wipeLog=(await getMeta('wipeLog'))||[];
  S.devId=(await getMeta('deviceId'))||"";
  if(!S.devId){S.devId=uid();await setMeta('deviceId',S.devId)}
  S.chainTip=S.ledger.length?S.ledger[S.ledger.length-1].hash||"":"";
  S.D=derive(S.entities,S.ledger);render()}

/* صلاحية الأونر: رقم سري مُجزَّأ، وفتح لجلسة واحدة فقط */
async function requireOwner(reason){
  if(!S.sec.pin)return true;
  if(S.session)return true;
  const v=await askPin("الرقم السري للأونر — "+reason);
  if(v===null)return false;
  if(await sha(v)!==S.sec.pin){toast("رقم سري غير صحيح","err");return false}
  S.session=true;render();toast("فُتحت صلاحية الأونر لهذه الجلسة","ok");return true}

/* ============ منطق التصفية ============ */
const round50=v=>Math.round((+v||0)/50)*50;
/* نسبة المكتب كسر: بسط على مقام — ٤/٩٦ أو ٥/٧٠.
   العمولة = الإجمالي × (البسط ÷ المقام).
   ٤/٩٦ = ٤٫١٦٧٪ · ٥/٧٠ = ٧٫١٤٣٪. لا علاقة للمجموع بـ١٠٠. */
const ratioPct=(a,b)=>{const d=+b||0;return d>0?(+a||0)/d*100:0};
function calcSettlement(f){
  const total=+f.total||0,office=+f.office||0,farmR=+f.farmRatio||0;
  const commission=f.commissionTouched?(+f.commission||0):round50(total*ratioPct(office,farmR)/100);
  const expenses=+f.expenses||0,prevDebt=+f.prevDebt||0,net=msum(total,-commission,-expenses);
  return{total,office,farmRatio:farmR,pct:ratioPct(office,farmR),commission,expenses,prevDebt,net,payable:msum(net,-prevDebt)}}

/* ============ الرسم ============ */
function render(){
  /* الرسم الكامل يهدم الـ DOM، فنلتقط حالة النموذج الذي يكتب فيه المستخدم ونرجّعها
     بعد الرسم — وإلا ضاع ما كتبه وسقط التركيز وقفزت الصفحة لأعلى. */
  const ae=document.activeElement;
  const keep=(ae&&ae.form&&ae.form.dataset&&ae.form.dataset.form)?{
    form:ae.form.dataset.form,name:ae.name,
    vals:Object.fromEntries([...ae.form.elements].filter(x=>x.name&&x.type!=='file').map(x=>[x.name,x.value])),
    ss:ae.selectionStart,se:ae.selectionEnd}:null;
  const sy=window.scrollY;
  $('#hdrDate').textContent=arDate(todayISO());
  $('#hdrName').textContent=S.co.name||"دفتر السماكة";
  $('#hdrSub').textContent=`نسخة ${APPVER} · يعمل بدون إنترنت`;
  const hl=$('#hdrLogo');
  hl.className='mark'+(S.co.logo?'':' own');
  hl.innerHTML=S.co.logo?`<img src="${S.co.logo}" alt="">`:BRANDMARK;
  document.body.dataset.theme = S.tab==='ops'?({box:'box',drv:'drivers',ice:'ice'})[S.sub.ops]
    : S.tab==='rep'?({box:'box',drv:'drivers',ice:'ice'})[S.sub.rep]||'' : '';
  $$('#nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.tab)));
  const app=$('#app');
  /* حاجز أخطاء: خطأ في شاشة واحدة كان يترك التطبيق أبيض بلا مخرج */
  try{ app.innerHTML=({home:vHome,fin:vFin,ops:vOps,rep:vRep,set:vSet})[S.tab](); }
  catch(err){
    console.error(err);
    app.innerHTML=`<div class="errbox"><b>حصل خطأ في عرض هذه الشاشة</b>
      بياناتك سليمة ومحفوظة — الخطأ في العرض فقط.<br><span class="num">${esc(err.message||'')}</span>
      <div class="btnrow" style="margin-top:12px"><button class="btn ghost" data-act="goHome">الرئيسية</button>
      <button class="btn ghost" data-act="exportJSON">تنزيل نسخة احتياطية</button></div></div>`;
    return;
  }
  wire(app);
  if(keep){
    const f=$(`form[data-form="${keep.form}"]`,app);
    if(f){
      for(const[k,v] of Object.entries(keep.vals)){
        const el=f.elements[k];
        if(el&&el.value!==undefined&&!(el.dataset&&el.dataset.role))el.value=v;
      }
      const el=f.elements[keep.name];
      if(el&&el.focus){el.focus();try{el.setSelectionRange(keep.ss,keep.se)}catch(e){}}
    }
  }
  paintFab();
  window.scrollTo(0,S.toTop?0:sy);S.toTop=false;
}
/* اختيار الجهة: القوائم المنسدلة تحتاج لمستين وتمريراً وقراءة نص صغير.
   القوائم القصيرة تُعرض كأزرار تُختار بلمسة واحدة، والطويلة (المزارع) عبر بحث. */
const INLINE_MAX=24;
function pickList(kind){
  const D=S.D;
  return ({farm:D.farms,merchant:D.merchants,driver:D.drivers,ice:D.factories,route:D.routes,
    loc:D.locOptions,farmerchant:[...D.farms,...D.merchants]})[kind]||[];
}
const PICKPH={farm:'اختر المزرعة',merchant:'اختر المبيع',driver:'اختر السائق',ice:'اختر المصنع',
  route:'اختر الرحلة',loc:'اختر الجهة أو المخزن',farmerchant:'اختر الجهة'};
function picker(name,kind,sel,o={}){
  const D=S.D,raw=pickList(kind),list=D.byRecent?D.byRecent(raw):raw;
  const role=o.role?` data-role="${o.role}"`:'';
  const hid=`<input type="hidden" name="${name}" value="${esc(sel||'')}" data-pick="${name}"${role}>`;
  if(!list.length)return hid+`<div class="empty" style="padding:14px">لا يوجد — أضفه من «الإعدادات»</div>`;
  if(list.length<=(o.max??INLINE_MAX)){
    return hid+`<div class="pks">${list.map(x=>
      `<button type="button" class="pk" data-act="pick" data-name="${name}" data-id="${x.id}"
        aria-pressed="${sel===x.id}">${esc(x.name)}</button>`).join('')}</div>`;
  }
  const cur=list.find(x=>x.id===sel);
  return hid+`<button type="button" class="pkbtn ${cur?'has':''}" data-act="pickOpen"
    data-name="${name}" data-kind="${kind}">
    <span class="pkv">${esc(cur?cur.name:(o.ph||PICKPH[kind]||'اختر…'))}</span>
    <span class="pkg">🔍 بحث</span></button>`;
}
/* ============ اختيار الجهات ============
   الاختيار من قائمة منسدلة على الموبايل بطيء ويخفي الخيارات.
   ≤ ٢٤ جهة  → كل الأسماء ظاهرة، لمسة واحدة تختار.
   > ٢٤ جهة  → آخر المستخدمة ظاهرة + بحث فوري في الباقي (حالة المزارع).
   القيمة تُحفظ في حقل مخفي بنفس الاسم، فلا يتغيّر أي منطق قائم. */
const PICKMAX=24;
/* الأنواع المركّبة تُعرض مفصولة بتبويب فوق الاقتراحات — أسماء المبايع والمزارع
   قد تتشابه، والخلط بينها يسبب أخطاء تسجيل. الوارد يبدأ على «مبايع» لأنه الغالب. */
const PICKGROUPS={
  farmerchant:[['merchant','مبايع'],['farm','مزارع']],
  loc:[['merchant','مبايع'],['farm','مزارع']],
  /* الفاتورة: الشغل اليومي على الدورات المفتوحة، وفتح دورة جديدة فعل مقصود */
  invfarm:[['active','دورات مفتوحة'],['new','فتح دورة جديدة']]
};
const GTAG={merchant:'مبيع',farm:'مزرعة',driver:'سائق',ice:'مصنع',route:'رحلة'};
let _pk=0;
function entList(t){
  const D=S.D;
  /* «فتح دورة جديدة»: المزارع اللي مالهاش دورة مفتوحة — جديدة أو مصفّاة.
     الدورة الجديدة مستقلة تماماً عن القديمة (دورة سمك جديدة). */
  const idle=D.farms.filter(f=>!f.cycleCount);
  return {farm:D.farms,merchant:D.merchants,driver:D.drivers,ice:D.factories,route:D.routes,
    loc:D.locOptions,farmerchant:[...D.farms,...D.merchants],
    invfarm:D.activeFarms,active:D.activeFarms,
    new:[...idle.filter(f=>!f.settlements.length),...idle.filter(f=>f.settlements.length)]}[t]||[];
}
function entPick(name,type,sel,o={}){
  const id='pk'+(++_pk);
  const groups=PICKGROUPS[type];
  let items=entList(type),gkey='',gcur='',pinWH=false;
  if(groups){
    gkey=name+':'+type;
    gcur=(S.pkg||(S.pkg={}))[gkey]||groups[0][0];
    S.pkg[gkey]=gcur;
    items=entList(gcur);
    pinWH=(type==='loc');
  }
  const many=items.length>PICKMAX;
  let show=items;
  if(many){
    const rec=(S.D.recent[type]||[]).map(x=>items.find(i=>i.id===x)).filter(Boolean);
    show=[...rec];
    if(show.length<6)for(const i of items){if(show.length>=6)break;if(!show.some(x=>x.id===i.id))show.push(i)}
    if(sel&&!show.some(i=>i.id===sel)){const x=items.find(i=>i.id===sel);if(x)show.unshift(x)}
  }
  const chip=i=>`<button type="button" class="pchip" data-pv="${i.id}" aria-pressed="${i.id===sel}">${esc(i.name)}</button>`;
  /* المختار يظل ظاهراً حتى لو من مجموعة أخرى، حتى لا يبدو الحقل فاضياً */
  const outside=sel&&!show.some(i=>i.id===sel)&&!(pinWH&&sel===WH)
    ?entList(type).find(i=>i.id===sel):null;
  return `<div class="pick" id="${id}" data-name="${name}" data-ent="${groups?gcur:type}">
    <input type="hidden" name="${name}" value="${sel||''}"${o.role?` data-role="${o.role}"`:''}>
    ${groups?`<div class="pkg">${groups.map(([g,l])=>
      `<button type="button" data-pkg="${gkey}" data-g="${g}" aria-pressed="${g===gcur}">${l}</button>`).join('')}
      </div>`:''}
    <div class="pkrow">
      ${pinWH?`<button type="button" class="pchip pkwh" data-pv="${WH}" aria-pressed="${sel===WH}">المخزن</button>`:''}
      ${outside?`<button type="button" class="pchip" data-pv="${outside.id}" aria-pressed="true">${esc(outside.name)} <span style="opacity:.7">· ${GTAG[outside.type]||''}</span></button>`:''}
      ${show.map(chip).join('')}
      ${o.optional?`<button type="button" class="pchip" data-pv="" aria-pressed="${!sel}">بدون</button>`:''}
      ${many?`<button type="button" class="pchip pksearch" data-act="pkOpen" data-pk="${id}">🔎 بحث في ${items.length}</button>`:''}
    </div>
    ${items.length?'':`<div class="empty" style="padding:14px">لا يوجد — أضف من «الإعدادات»</div>`}</div>`;
}
/* ورقة البحث: تصفية فورية بالاسم أو المكان */
function openPicker(pkId){
  const el=$('#'+pkId);if(!el)return;
  /* data-ent يحمل المجموعة الحالية للأنواع المركّبة، فالبحث داخلها وحدها */
  const type=el.dataset.ent,cur=el.querySelector('input').value;
  const items=entList(type);
  const draw=q=>{
    const t=(q||'').trim().toLowerCase();
    const f=t?items.filter(i=>(i.name+' '+(i.place||'')).toLowerCase().includes(t)):items;
    return f.slice(0,80).map(i=>`<button type="button" class="drow" data-pv="${i.id}">
      <span class="tname">${esc(i.name)}</span>
      <span class="tag">${GTAG[i.type]||''}</span>
      ${i.place?`<span style="color:var(--muted);font-size:13px">${esc(i.place)}</span>`:''}
      <span class="go">${i.id===cur?'✓':'‹'}</span></button>`).join('')||`<div class="empty">لا نتائج لـ «${esc(q)}»</div>`;
  };
  const d=$('#dlg');
  d.innerHTML=`<div class="sheet"><h3>اختر ${esc(ENTAR[type]||'جهة')}</h3>
    <p class="sub">${items.length} مسجَّلة — اكتب حرفين للتصفية</p>
    <div class="field"><input id="pkq" placeholder="بحث بالاسم أو المكان…" autocomplete="off" enterkeyhint="search"></div>
    <div id="pklist" style="max-height:50vh;overflow:auto">${draw('')}</div>
    <button type="button" class="btn ghost" id="pkx" style="margin-top:12px">إلغاء</button></div>`;
  d.classList.add('on');
  const close=()=>{d.classList.remove('on');d.innerHTML='';d.onclick=null};
  const q=$('#pkq');
  q.addEventListener('input',()=>{$('#pklist').innerHTML=draw(q.value)});
  d.onclick=ev=>{
    if(ev.target===d||ev.target.id==='pkx')return close();
    const b=ev.target.closest('[data-pv]');if(!b)return;
    setPick(pkId,b.dataset.pv);close();
  };
  setTimeout(()=>q.focus(),90);
}
function setPick(pkId,val){
  const el=$('#'+pkId);if(!el)return;
  const inp=el.querySelector('input');
  inp.value=val;
  const row=el.querySelector('.pkrow');
  let found=false;
  el.querySelectorAll('.pchip[data-pv]').forEach(b=>{
    const on=b.dataset.pv===val;b.setAttribute('aria-pressed',String(on));if(on)found=true});
  if(val&&!found){
    const it=entList(el.dataset.ent).find(i=>i.id===val)||(val===WH?{id:WH,name:'المخزن'}:null);
    if(it){const b=document.createElement('button');b.type='button';b.className='pchip';
      b.dataset.pv=val;b.setAttribute('aria-pressed','true');b.textContent=it.name;
      row.insertBefore(b,row.firstChild)}
  }
  inp.dispatchEvent(new Event('change',{bubbles:true}));
}
function entPickList(name,items,sel){
  const id='pk'+(++_pk);
  return `<div class="pick" id="${id}" data-name="${name}" data-ent="farm">
    <input type="hidden" name="${name}" value="${sel||''}">
    <div class="pkrow">${items.map(i=>
      `<button type="button" class="pchip" data-pv="${i.id}" aria-pressed="${i.id===sel}">${esc(i.name)}</button>`).join('')
      ||'<div class="empty" style="padding:14px">لا يوجد</div>'}</div></div>`;
}

  const links=`<div class="finlinks">
    <button data-act="finGo" data-s="settle" aria-selected="${cur==='settle'}">
      تصفية مزرعة${na?`<span>${na}</span>`:''}</button>
    <button data-act="finGo" data-s="draft" aria-selected="${cur==='draft'}">

    <button data-act="finGo" data-s="archive" aria-selected="${cur==='archive'}">
      الأرشيف${nr?`<span>${nr}</span>`:''}</button></div>`;

      ${isNew?`<p class="note" style="color:var(--brass)">اختيار مزرعة من هنا يبدأ لها <b>دورة جديدة</b> مستقلة عن دوراتها السابقة.</p>`:''}</div>
    <div class="field"><label>المبيع</label>${entPick('merchantId','merchant','')}</div>
    <div class="row">

/* ---------- ٣) العمليات ---------- */
function vOps(){
  const s=seg('ops',[["box","📦 بكش"],["drv","🚚 سائقين"],["ice","🧊 ثلج"]],S.sub.ops);
  return s+({box:opsBox,drv:opsDrv,ice:opsIce})[S.sub.ops]();

/* --- بكش --- */
/* كل عملية بكش في تبويب مستقل — الشاشة الواحدة كانت تحمل ستة نماذج فوق بعض */
const BOXGROUP={
  out:[['issue_farm','صرف لمزرعة'],['scrap_out','تالف للتدوير']],
  in:[['return_in','وارد راجع'],['factory_replace','استبدال'],['purchase_in','شراء جديد']],
  move:[['sale_move','بيع سمك'],['empty_back','فارغة لمزرعة'],['farm_swap','بين مزرعتين']],
  /* الشائع أولاً، والنادر خلف زر — كان ستة نماذج متساوية تزحم الشاشة */
  adj:[['audit','جرد'],['opening_box','رصيد افتتاحي']],
  adjRare:[['fix_d2i','تالف ← سليم'],['fix_i2d','سليم ← تالف'],
       ['out_noone','خروج بلا متلقي'],['in_nosource','دخول بلا مصدر']]
};
const BOXHINT={
  issue_farm:'يخرج من رصيد المخزن السليم ويُقيَّد على المزرعة كعُهدة مرتجعة.',
  scrap_out:'خروج نهائي بلا انتظار عودة — لا يُقيَّد على أحد.',
  return_in:'سجّل السليم والتالف معاً. لو التالف بإهمال يُقيَّد رقماً على السائق للمتابعة فقط — لا فلوس ولا عهدة، والصناديق تدخل المخزن عادي.',
  factory_replace:'تالف يخرج وسليم يدخل بدلاً منه من مصدر الاستبدال.',
  purchase_in:'يزيد رصيد المخزن السليم.',
  sale_move:'تنقل العُهدة من المزرعة إلى المبيع. المخزن لا يدخل هذه الحركة.',
  empty_back:'رجوع البكش الفارغة من المبيع إلى مزرعة.',
  farm_swap:'نقل عُهدة بين مزرعتين مباشرة.',
  fix_d2i:'تصحيح خطأ رصد داخل المخزن — التالف لا يوجد إلا فيه، والإجمالي لا يتغيّر.',
  fix_i2d:'تصحيح خطأ رصد داخل المخزن — الإجمالي لا يتغيّر.',
  out_noone:'ضياع أو سرقة — يُقيَّد فاقداً على الموقع. خارج المخزن يُحسب سليماً.',
  in_nosource:'بكش مجهول المصدر دخل الموقع.',
  opening_box:'نقطة البداية قبل تشغيل التطبيق. خانة التالف للمخزن وحده.'
};
function opsBox(){
  const D=S.D;
  if(!D.farms.length&&!D.merchants.length)return `<div class="empty"><b>لا توجد جهات</b>أضف مزرعة أو مبيعاً من «الإعدادات».</div>`;
  const g=S.sub.box;
  const head=seg('box',[["out","صادر"],["in","وارد"],["move","تحويلات"],["adj","جرد وتسويات"],["bal","الأرصدة"]],g,true);
  if(g==='bal')return head+`<div style="height:14px"></div>`+bxBal();
  const rare=g==='adj'&&S.rare;
  const ops=(BOXGROUP[g]||[]).concat(rare?BOXGROUP.adjRare:[]);
  if(!ops.some(o=>o[0]===S.sub.boxop))S.sub.boxop=ops[0][0];
  const op=S.sub.boxop;
  return head+`<div style="height:10px"></div>`+seg('boxop',ops,op,true)
    +(g==='adj'?`<button class="rarebtn" data-act="rare">${rare?'▴ إخفاء العمليات النادرة':'▾ عمليات نادرة (تصحيح رصد · بلا طرف)'}</button>`:'')
    +`<p class="note" style="margin:12px 0">🔒 حركات البكش لا تمسّ مديونية مبيع ولا مستحق مزرعة.</p>`
    +(op==='audit'?auditForm():boxForm(op,'تسجيل الحركة',op==='sale_move'?invPicker():''))
    +boxLog([op],5);
}
function invPicker(){
  const D=S.D,p=D.unlinked.slice(-15).reverse();
  if(!p.length)return '';
  return `<div class="field"><label>ربط بفاتورة <span class="hint">${p.length} فاتورة بلا حركة بكش</span></label>
    <select name="invoiceId" data-role="invPick"><option value="">بدون ربط</option>${p.map(i=>
    `<option value="${i.id}" data-farm="${i.farmId}" data-merchant="${i.merchantId}" data-boxes="${i.boxes}">${arDate(i.date)} · ${esc(D.nameOf(i.farmId))} ← ${esc(D.nameOf(i.merchantId))} · ${i.boxes} ص</option>`).join('')}</select></div>`;
}
function auditForm(){
  const D=S.D;
  return `<div class="card"><form data-form="audit">
    <p class="note" style="margin:0 0 14px">${BOXHINT.audit||'الفرق بين المعدود والدفتري يُقيَّد آلياً.'}</p>
    <div class="field"><label>التاريخ</label><input type="date" name="date" value="${todayISO()}" required></div>
    <div class="field"><label>الجهة المجرودة <span class="hint">اختر «المخزن» لجرد المخزن</span></label>

    <div data-role="adiff"></div>
    <div class="field"><label>ملاحظة</label><input name="note" placeholder="من حضر الجرد…"></div>
    <button class="btn" type="submit">اعتماد الجرد وتسوية الفرق</button>
    <p class="note">العجز يخرج للفاقد على الجهة، والزيادة تدخل كـ«بلا مصدر».</p></form></div>`;

function boxForm(op,btn,extra=""){
  const f=BOXF[op]||[];
  return `<div class="card"><form data-form="box" data-op="${op}">
    ${BOXHINT[op]?`<p class="note" style="margin:0 0 14px">${BOXHINT[op]}</p>`:''}
    <div class="field"><label>التاريخ</label><input type="date" name="date" value="${todayISO()}" required></div>

    <button class="btn" type="submit">${btn}</button></form></div>`;

function fieldHTML(k,l,t,e,optional,val=""){
  const D=S.D;
  if(t==='num')return `<div class="field"><label>${l}${optional?' <span class="hint">اختياري</span>':''}</label>
    <input type="number" name="${k}" min="0" step="${k==='cost'?'0.01':'1'}" inputmode="${k==='cost'?'decimal':'numeric'}" value="${val||(optional?0:'')}" ${optional?'':'required'}></div>`;
  if(t==='reason')return `<div class="field"><label>${l} <span class="hint">يظهر فقط لو فيه تالف</span></label>
    <select name="${k}">

/* عدد الصناديق الحقيقي في الحركة.
   الأرجل المارّة بعقدة التصحيح #ADJ تمثّل نفس الصندوق مرتين (خروج ثم دخول
   بحالة أخرى)، فحسابها بالجمع المباشر كان يضاعف العدد. */
function boxQty(e){
  const p=e.params||{};
  if(e.op==='return_in')return Math.round(+p.okCount||0)+Math.round(+p.dmgCount||0);
  if(e.op==='factory_replace')return Math.max(Math.round(+p.damagedOut||0),Math.round(+p.intactIn||0));
  if(e.op==='opening_box')return Math.abs(Math.round(+p.oIntact||0))+Math.round(+p.oDamaged||0);
  return sum(legsOf(e).filter(l=>l.from!=='#ADJ'),l=>l.count);
}
/* وصف مختصر للكميات حسب نوع العملية */
function boxQtyTxt(e){
  const p=e.params||{};
  if(e.op==='return_in'){const a=Math.round(+p.okCount||0),b=Math.round(+p.dmgCount||0);
    return b?`${a} سليم + ${b} تالف = ${a+b}`:`${a} سليم`}
  if(e.op==='factory_replace')return `${Math.round(+p.damagedOut||0)} تالف ↔ ${Math.round(+p.intactIn||0)} سليم`;
  if(e.op==='audit'&&e.counted&&e.book){
    const di=e.counted.intact-e.book.intact,dd=e.counted.damaged-e.book.damaged;
    return [di?`سليم ${di>0?'+':''}${di}`:'',dd?`تالف ${dd>0?'+':''}${dd}`:''].filter(Boolean).join(' · ')||'مطابق'}
  if(e.op==='opening_box'&&(+((e.params||{}).dir)||1)<0)return `${boxQty(e)} عندنا`;
  return String(boxQty(e));
}
function legsTxt(e){return legsOf(e).map(l=>`${S.D.nameOf(l.from)} ← ${S.D.nameOf(l.to)}: ${l.count} ${CONDAR[l.cond]}`).join(" · ")}
/* مسار الحركة بلا تكرار: نتجاهل عقدة التصحيح ونعرض الطرفين الحقيقيين */
function boxFlow(e){
  const L=legsOf(e).filter(l=>l.from!=='#ADJ'&&l.to!=='#ADJ');
  const seen=new Set(),out=[];
  (L.length?L:legsOf(e)).forEach(l=>{const k=l.from+'>'+l.to;
    if(!seen.has(k)){seen.add(k);out.push(`${S.D.nameOf(l.from)} ← ${S.D.nameOf(l.to)}`)}});
  return out.join(' · ');
}
function boxLog(ops,limit=6){
  const items=S.ledger.filter(e=>(e.type==='box'||e.type.startsWith('box_'))&&(!ops||ops.includes(e.op)))
    .sort((a,b)=>b.seq-a.seq).slice(0,limit);
  if(!items.length)return '';
  return `<div class="eyebrow">آخر الحركات</div>`+items.map(e=>recHTML(e,
    (BOXOP[e.op]||'حركة بكش')+(e.auto?' · آلي':'')+(e.dmgReason==='negligence'?' · إهمال':''),
    boxFlow(e)+(e.driverId?` · ${S.D.nameOf(e.driverId)}`:''),
    boxQtyTxt(e))).join('');
}

const searchStr=e=>e._s||(e._s=[e.note,e.destination,S.D.nameOf(e.farmId),S.D.nameOf(e.merchantId),

const inR=e=>{const F=S.F;return (!F.from||e.date>=F.from)&&(!F.to||e.date<=F.to)&&

function handIssues(from,to){
  const D=S.D,I=[];
  const L=D.live.filter(e=>e.date>=from&&e.date<=to);
  const dft=L.filter(e=>e.type==='invoice'&&!(+e.amount>0));
  if(dft.length)I.push(['مسوّدات بلا مبلغ',dft.length+' فاتورة',
    'اكتب مبلغها من «الحسابات ← مسوّدات» قبل التصفية','goDrafts','']);
  const unl=D.unlinked.filter(i=>i.date>=from&&i.date<=to);
  if(unl.length)I.push(['فواتير بلا حركة بكش',unl.length+' فاتورة',
    'سجّل حركة البكش أو فعّل الترحيل الآلي','','']);
  if(D.wh.intact<0||D.wh.damaged<0)I.push(['رصيد المخزن بالسالب',
    `${D.wh.intact} سليم · ${D.wh.damaged} تالف`,'سجّل رصيداً افتتاحياً للمخزن أو اعمل جرد','','']);
  const neg=[...D.mBox,...D.fBox].filter(x=>x.box.intact<0);
  if(neg.length)I.push(['جهات عهدتها بالسالب',neg.map(x=>x.name).join(' · '),
    'بكش يخصّها عندنا — طبيعي، أو راجع الحركات','','']);
  const dmg=D.drivers.filter(d=>d.dmg.open>0);
  if(dmg.length)I.push(['تالف بإهمال مفتوح',dmg.map(d=>`${d.name} (${d.dmg.open})`).join(' · '),
    'صفّه من «العمليات ← سائقين ← التالف»','','']);
  const oldF=D.activeFarms.filter(f=>f.cycleInvoices.length&&f.cycleInvoices[0].date<addDays(todayISO(),-21));
  if(oldF.length)I.push(['دورات مفتوحة من أكتر من ٣ أسابيع',oldF.map(f=>f.name).join(' · '),
    'راجع تصفيتها','goFarms','']);
  return I;
}
